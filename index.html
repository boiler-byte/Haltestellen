  <title>Haltestellen – Dein ÖPNV auf einen Blick</title>
  <!--
    Haltestellen – privater, nichtkommerzieller Open-Source-Prototyp (MIT-Lizenz).
    Daten: Transitous/MOTIS 2, OpenStreetMap und die jeweiligen Verkehrsanbieter.
    Transitous erlaubt leichte Prototyp-Tests. Bei Veröffentlichung gelten
    https://transitous.org/api/ : Quellcode, Attribution, Website mit Kontakt,
    nichtkommerzielle Nutzung und sparsamer Umgang mit Anfragen.
    Für den dauerhaften Betrieb auf einer HTTPS-Seite hosten: file:// sendet
    keinen verwertbaren Referer und kann je nach Browser CORS-Probleme auslösen.

  <style>

  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script>
  (() => {
    'use strict';

    // Transitous/MOTIS2: ohne API-Schlüssel, nur für nichtkommerzielle Nutzung.
    // Für dauerhafte Nutzung als Website mit Kontakt veröffentlichen (Referer).
    const API = 'https://api.transitous.org';
    const STOPTIMES_ENDPOINT = '/api/v6/stoptimes';
    const PLAN_ENDPOINT = '/api/v6/plan';
    const GEOCODE_ENDPOINT = '/api/v1/geocode';
    const STORAGE_KEY = 'nextstop.v1';
    const AUTO_WINDOW = 30 * 60 * 1000;
    const PRIORITY_WINDOWS = [15,30,45,60,90,120];
    const DEFAULT_PRIORITY_MINUTES = 90; // Bisheriger Standard für v2-Bestandsdaten.
    const REFRESH_INTERVAL = 3 * 60 * 1000;
    const PLAN_COOLDOWN = 15 * 60 * 1000; // Schont die Transitous-Routing-API.
    const STOPTIMES_COUNT = 45;
    const BOARD_DURATION_MIN = 90;
    const MODES = [
      ['all', 'Alle Verkehrsmittel'],
      ['bus', 'Bus'],
      ['suburban', 'S-Bahn'],
      ['regional', 'RE / RB'],
      ['subway', 'U-Bahn'],
      ['tram', 'Straßenbahn'],
      ['longDistance', 'ICE / IC / EC'],
      ['ferry', 'Fähre']

    const PRODUCT_FILTERS = {
      all: [], bus: ['bus'], suburban: ['suburban'], regional: ['regionalExpress','regional'],
      subway: ['subway'], tram: ['tram'], longDistance: ['nationalExpress','national'], ferry: ['ferry']
    };
    const ALL_PRODUCTS = ['nationalExpress','national','regionalExpress','regional','suburban','bus','ferry','subway','tram','taxi'];
    const ICONS = {
      train: '<rect x="5" y="3" width="14" height="15" rx="3"/><path d="M8 21l2-3m6 0 2 3M5 11h14M8 7h2m4 0h2M8 15h.01M16 15h.01"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      arrowRight: '<path d="M5 12h14m-6-6 6 6-6 6"/>',
      chevronRight: '<path d="m9 18 6-6-6-6"/>',
      arrowLeft: '<path d="m19 12-14 0m6-6-6 6 6 6"/>',
      pin: '<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      refresh: '<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.8 9A7 7 0 0 1 18 7l2 5M4 12l2 5a7 7 0 0 0 12.2-2"/>',
      star: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/>',
      layers: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
      trash: '<path d="M3 6h18m-2 0-1 15H6L5 6m3 0V4h8v2m-6 4v7m4-7v7"/>',
      close: '<path d="M18 6 6 18M6 6l12 12"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/>',
      check: '<path d="m5 12 4 4L19 6"/>',
      alert: '<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v4m0 4h.01"/>',
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',
      edit: '<path d="M12 20h9M16 4l4 4-11 11H5v-4L16 4Z"/>',
      arrows: '<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>',
      bus: '<rect x="5" y="3" width="14" height="16" rx="3"/><path d="M5 11h14M8 19v2m8-2v2M8 15h.01M16 15h.01"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>'
    };

    const el = id => document.getElementById(id);
    const icon = (name, cls = '') => `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.info}</svg>`;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uid = () => (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
    const norm = s => String(s || '').toLocaleLowerCase('de-DE').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/\s*\([^)]*\)\s*/g,' ').replace(/[^\p{L}\p{N}]/gu,' ').replace(/\s+/g,' ').trim();
    // Unterschiedliche Bezeichnungen für dieselbe Station vereinheitlichen.
    const stationKey = s => norm(String(s||'').replace(/hauptbahnhof/gi,'Hbf').replace(/\bHauptbf\b/gi,'Hbf').replace(/\bBhf\b/gi,'Bahnhof').replace(/[,\s]+(?:Gleis|Steig|Bahnsteig|Platform)\s*[0-9a-z]+.*$/i,''));
    const coordinates = p => ({lat:Number(p?.lat??p?.latitude??p?.location?.latitude),lon:Number(p?.lon??p?.longitude??p?.location?.longitude)});
    const distanceMeters = (a,b) => {
      const x=coordinates(a),y=coordinates(b);
      if(![x.lat,x.lon,y.lat,y.lon].every(Number.isFinite) || ![x.lat,x.lon,y.lat,y.lon].every(v => Math.abs(v)>0.01)) return Infinity;
      const r=Math.PI/180,dy=(y.lat-x.lat)*r,dx=(y.lon-x.lon)*r;
      const q=Math.sin(dy/2)**2+Math.cos(x.lat*r)*Math.cos(y.lat*r)*Math.sin(dx/2)**2;
      return 6371000*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
    };
    const relativeMinutes = date => date == null ? null : Math.ceil((date - Date.now()) / 60000);
    const modeLabel = mode => (MODES.find(m => m[0] === mode) || MODES[0])[1];
    const toTime = value => { if (!value) return null; const t = new Date(value).getTime(); return Number.isFinite(t) ? t : null; };
    const timeOf = entry => toTime(entry?.when ?? entry?.plannedWhen ?? entry?.departure ?? entry?.plannedDeparture ?? entry?.arrival ?? entry?.plannedArrival);
    const fmtTime = value => value ? new Intl.DateTimeFormat('de-DE', {hour:'2-digit',minute:'2-digit'}).format(new Date(value)) : '–:–';
    const fmtDate = () => new Intl.DateTimeFormat('de-DE', {weekday:'long',day:'numeric',month:'long'}).format(new Date());
    const isCancelled = item => Boolean(item?.cancelled || item?.canceled || (item?.when === null && item?.plannedWhen && item?.delay === null));
    const stopById = id => state.stops.find(s => s.id === String(id));
    const isFuture = item => { const t = timeOf(item); return t != null && t >= Date.now() - 90000 && !isCancelled(item); };
    const isWithin = (item, window) => isFuture(item) && timeOf(item) <= Date.now() + window;
    const manualWindowMs = () => state.priorityMinutes * 60 * 1000;
    const scheduledTimeOf = entry => toTime(entry?.plannedWhen ?? entry?.plannedDeparture) ?? timeOf(entry);
    function inManualWindow(entry) {
      // Die Auswahl gilt symmetrisch um die PLANMÄSSIGE Zeit. Verspätete Fahrten
      // bleiben sichtbar, wenn die planmäßige Abfahrt bereits zurückliegt,
      // die tatsächliche Abfahrt aber noch bevorsteht.
      const planned=scheduledTimeOf(entry), now=Date.now();
      return planned!==null && !isCancelled(entry) && timeOf(entry)!==null
        && timeOf(entry)>=now-90000 && Math.abs(planned-now)<=manualWindowMs();
    }
    function hasCityPrefix(stop) {
      const city=norm(stop.city), name=norm(stop.name);
      return Boolean(city && (name===city || name.startsWith(`${city} `)));
    }

    function readSaved() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const stops = Array.isArray(parsed.stops) ? parsed.stops.filter(s => s && typeof s.id === 'string' && typeof s.name === 'string').slice(0,100) : [];
        const routes = Array.isArray(parsed.routes) ? parsed.routes.filter(r => r && r.from && r.to && r.from !== r.to && PRODUCT_FILTERS[r.mode || 'all'] !== undefined).slice(0,100) : [];
        const preference=Number(parsed.priorityMinutes);
        const priorityMinutes=PRIORITY_WINDOWS.includes(preference) ? preference : DEFAULT_PRIORITY_MINUTES;
        return {stops, routes, priorityMinutes};
      } catch { return {stops:[],routes:[],priorityMinutes:DEFAULT_PRIORITY_MINUTES}; }
    }
    const saved = readSaved();
    const state = {
      stops:saved.stops, routes:saved.routes, priorityMinutes:saved.priorityMinutes, view:'home', activeStopId:null, detailTab:'departures',
      boards:new Map(), arrivals:new Map(), projections:new Map(), loading:new Set(), arriving:new Set(),
      errors:new Map(), arrivalErrors:new Map(), timestamps:new Map(),
      modal:null, selectedCandidate:null, searchResults:[], searchTerm:'', searchState:'idle', searchToken:0,
      busy:false, migrating:false, planCache:new Map(), lastRefresh:0, lastApiRequestAt:null, pendingPriorityRefresh:false, searchTimer:null, toastTimer:null
    };
    function persist() {
      try {localStorage.setItem(STORAGE_KEY, JSON.stringify({stops:state.stops,routes:state.routes,priorityMinutes:state.priorityMinutes}));}
      catch { toast('Speichern nicht möglich. Prüfe die Browser-Einstellungen.', true); }
    }
    function guessCity(place) {
      const direct = place?.address?.city || place?.location?.address?.city || place?.city;
      if (direct) return String(direct);
      const cityArea=(place?.areas||[]).find(a=>a?.default && a?.name)
        || (place?.areas||[]).find(a=>a?.name && Number(a.adminLevel)>=7 && Number(a.adminLevel)<=9);
      if(cityArea) return String(cityArea.name);
      const name = String(place?.name || '').trim();
      const comma = name.split(',').map(s => s.trim()).filter(Boolean);
      if (comma.length > 1) {
        if (/^(s\+u|s |u |tram|bus|bf\b|bahnhof\b|hbf\b)/i.test(comma[0])) return comma[1];
        return comma[0];
      }
      const m = name.match(/^(.+?)\s+(?:Hbf|Hauptbahnhof|Bahnhof|ZOB|Busbahnhof)\b/i);
      if (m) return m[1];
      const tokens = name.split(/\s+/);
      if (tokens.length >= 2 && /^(Bad|Sankt|St\.)$/i.test(tokens[0])) return tokens.slice(0,2).join(' ');
      return tokens[0] || 'Ort unbekannt';
    }
    function sameStop(a,b) {
      if (!a || !b) return false;
      const aId=String(a.id ?? a.stopId ?? a.stop?.id ?? '');
      const bId=String(b.id ?? b.stopId ?? b.stop?.id ?? '');
      if (aId && bId && aId === bId) return true;
      const an=stationKey(a.name||a.stop?.name), bn=stationKey(b.name||b.stop?.name);
      if(an && bn && an===bn) return true;
      // Plattform-ID und übergeordnete Station weichen im GTFS teils voneinander ab.
      return distanceMeters(a,b)<=160 && Boolean(an && bn && (an.includes(bn)||bn.includes(an)));
    }
    function motisProduct(entry) {
      const mode=String(entry?.mode||'').toUpperCase();
      const name=String(entry?.displayName||entry?.routeShortName||'');
      if(mode==='BUS'||mode==='COACH') return 'bus';
      if(mode==='TRAM') return 'tram';
      if(mode==='SUBWAY'||mode==='METRO') return 'subway';
      if(mode==='SUBURBAN') return 'suburban';
      if(mode==='FERRY') return 'ferry';
      if(['HIGHSPEED_RAIL','LONG_DISTANCE','NIGHT_RAIL'].includes(mode)) return 'nationalExpress';
      if(mode==='REGIONAL_FAST_RAIL') return 'regionalExpress';
      if(mode==='REGIONAL_RAIL') return 'regional';
      if(mode==='RAIL'||mode==='TRANSIT') {
        if(/^(?:ICE|IC|EC|EN|NJ|RJ|TGV|FLX)\b/i.test(name)) return 'nationalExpress';
        if(/^RE\b/i.test(name)) return 'regionalExpress';
        if(/^S\s?\d/i.test(name)) return 'suburban';
        return 'regional';
      }
      return 'other';
    }
    function motisLineName(item) {
      const explicit=String(item.displayName||'').trim();
      if(explicit) return explicit;
      const short=String(item.routeShortName || item.tripShortName || '').trim();
      if(!short) return item.mode==='BUS' ? 'Bus' : 'ÖPNV';
      if(/^[0-9]+[a-z]?$/i.test(short)) {
        const prefixes={REGIONAL_FAST_RAIL:'RE',REGIONAL_RAIL:'RB',SUBURBAN:'S',HIGHSPEED_RAIL:'ICE',LONG_DISTANCE:'IC'};
        const prefix=prefixes[String(item.mode||'').toUpperCase()];
        if(prefix) return `${prefix} ${short}`;
      }
      return short;
    }
    function normalizeStopTime(item, arrival=false) {
      const place=item.place||{};
      const actual=arrival ? place.arrival||place.scheduledArrival : place.departure||place.scheduledDeparture;
      const planned=arrival ? place.scheduledArrival||actual : place.scheduledDeparture||actual;
      const delta=(item.realTime === true && toTime(actual)!=null && toTime(planned)!=null)
        ? Math.round((toTime(actual)-toTime(planned))/1000) : null;
      const stops=arrival ? (item.previousStops||[]) : (item.nextStops||[]);
      return {
        when:actual,plannedWhen:planned,delay:delta,
        platform:place.track||null,plannedPlatform:place.scheduledTrack||null,
        direction:item.headsign||item.tripTo?.name||'Ohne Angabe',
        provenance:arrival ? (stops[0]?.name||'Herkunft unbekannt') : null,
        line:{name:motisLineName(item),id:`${item.mode||''}:${item.routeShortName||item.displayName||''}`,product:motisProduct(item)},
        tripId:item.tripId||null,
        cancelled:!!(item.cancelled||item.tripCancelled||place.cancelled),
        stopovers:stops.map(p=>({stop:{id:p.stopId||null,name:p.name,lat:p.lat,lon:p.lon},arrival:p.arrival||p.scheduledArrival||null,plannedArrival:p.scheduledArrival||null})),
        _realTime:!!item.realTime
      };
    }
    function normalizeBoard(data,arrival=false) {
      if(!Array.isArray(data?.stopTimes)) throw new Error('Das Datenformat der Abfahrtstafel hat sich geändert.');
      return data.stopTimes.map(st=>normalizeStopTime(st,arrival))
        .filter(st=>timeOf(st)!=null)
        .sort((a,b)=>timeOf(a)-timeOf(b));
    }
    function stationCandidates(data) {
      return (Array.isArray(data)?data:[]).filter(s=>s && s.id && s.name && s.type==='STOP');
    }
    function lineName(entry) { return String(entry?.line?.name || entry?.line?.fahrtNr || 'ÖPNV'); }
    function productOf(entry) { return entry?.line?.product || entry?.product || ''; }
    function isMode(entry, mode) { return mode === 'all' || (PRODUCT_FILTERS[mode] || []).includes(productOf(entry)); }
    function lineClass(entry) {
      const p = productOf(entry);
      if (p === 'bus') return 'bus';
      if (p === 'tram') return 'tram';
      if (p === 'subway') return 'subway';
      if (['regionalExpress','regional','nationalExpress','national','suburban'].includes(p)) return 'rail';
      return 'other';
    }
    function destinationOf(entry, arrival = false) {
      if (arrival) return entry?.provenance || entry?.origin?.name || entry?.stopovers?.[0]?.stop?.name || entry?.direction || 'Ohne Angabe';
      return entry?.direction || entry?.destination?.name || 'Ohne Angabe';
    }
    function delayLabel(entry) {
      if (isCancelled(entry)) return '<span class="delay cancel">Fällt aus</span>';
      const delay = entry?.delay;
      if (delay === null || delay === undefined || !Number.isFinite(Number(delay))) return '<span class="delay unknown">Fahrplan</span>';
      const min = Math.round(Number(delay)/60);
      if (min >= 1) return `<span class="delay late">+${min} Min Verspätung</span>`;
      if (min <= -1) return `<span class="delay">${min} Min früher</span>`;
      return '<span class="delay">Pünktlich</span>';
    }
    function livePlatform(entry) {
      const platform = entry?.platform ?? entry?.plannedPlatform;
      return platform ? `Gleis / Steig ${esc(platform)}` : 'Steig unbekannt';
    }
    function getDirectTarget(entry, from, target) {
      if (!target || !from || String(from.id) === String(target.id)) return false;
      const first = timeOf(entry);
      const stops = Array.isArray(entry?.stopovers) ? entry.stopovers : [];
      if (stops.some(item => {
        const destination = item?.stop || item?.station || item;
        if (!sameStop(destination,target)) return false;
        const arrival = toTime(item?.arrival || item?.plannedArrival || item?.departure || item?.plannedDeparture);
        return !arrival || !first || arrival >= first - 60000;
      })) return true;
      // Die Fahrt endet direkt an der gemerkten Haltestelle (auch ohne Stopovers).
      const direction = norm(entry?.direction || entry?.destination?.name);
      return Boolean(direction && direction === norm(target.name));
    }
    function automaticTarget(entry, from) {
      return state.stops.find(to => String(to.id) !== String(from.id) && getDirectTarget(entry,from,to)) || null;
    }
    function allDepartures(id) {
      const board = state.boards.get(String(id)) || [];
      const extras = state.projections.get(String(id)) || [];
      const result = board.slice();
      for (const extra of extras) {
        const duplicate = board.some(d => {
          const t1 = timeOf(d),t2=timeOf(extra);
          return t1 != null && t2 != null && Math.abs(t1-t2) < 5*60*1000 && (String(d?.line?.id || '').length && d?.line?.id === extra?.line?.id || norm(lineName(d)) === norm(lineName(extra)));
        });
        if (!duplicate) result.push(extra);
      }
      return result.sort((a,b) => (timeOf(a)||0)-(timeOf(b)||0));
    }
    function manualRouteFor(entry, from) {
      return state.routes.find(route => {
        if (String(route.from) !== String(from.id) || !isMode(entry,route.mode)) return false;
        if (entry._routeId && entry._routeId === route.id) return true;
        const target = stopById(route.to);
        return getDirectTarget(entry,from,target);
      }) || null;

    function chooseDeparture(stop) {
      const deps = allDepartures(stop.id).filter(isFuture);
      const manual = deps.filter(d => inManualWindow(d) && manualRouteFor(d,stop));
      if (manual.length) {
        const entry = manual[0], route = manualRouteFor(entry,stop);
        return {entry, kind:'manual', target:stopById(route.to), route};
      }
      const automatic = (state.boards.get(stop.id)||[]).filter(d => isWithin(d,AUTO_WINDOW) && automaticTarget(d,stop));
      if (automatic.length) {
        const entry = automatic[0];
        return {entry,kind:'automatic',target:automaticTarget(entry,stop)};
      }
      const normal = (state.boards.get(stop.id)||[]).find(isFuture);
      return normal ? {entry:normal,kind:'normal',target:null} : null;
    }
    function statusText(error) {
      if (error?.status === 429) return 'API-Limit erreicht – bitte später aktualisieren.';
      if (error?.name === 'AbortError') return 'Die API-Anfrage hat zu lange gedauert.';
      if (error?.status && error.status >= 500) return 'Der Datenanbieter ist momentan nicht erreichbar.';
      if (error?.status === 404) return 'Haltestelle in dieser Datenquelle nicht verfügbar. Bitte neu zuordnen.';
      if (error?.name === 'TypeError') return 'Browserabruf fehlgeschlagen (Netzwerk/CORS). App über HTTPS öffnen.';
      return error?.message && /Datenformat|geändert/.test(error.message) ? error.message : 'Live-Daten konnten nicht geladen werden.';
    }
    function updateApiRequestLabel() {
      const label=el('api-request-label');

      const status=el('api-request-status');
      if(status) status.title=state.lastApiRequestAt
        ? `Letzter API-Anfrageversuch: ${new Date(state.lastApiRequestAt).toLocaleString('de-DE')}`
        : 'Es wurde noch keine API-Anfrage gestartet.';

    async function fetchJSON(path, params = {}, timeout = 15000) {
      state.lastApiRequestAt=Date.now();
      updateApiRequestLabel();
      const search = new URLSearchParams(params);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(),timeout);
      try {
        const response = await fetch(`${API}${path}?${search.toString()}`, {
          method:'GET',mode:'cors',credentials:'omit',
          headers:{'Accept':'application/json'},signal:controller.signal
        });
        if (!response.ok) {const error = new Error(`HTTP ${response.status}`);error.status=response.status;throw error;}
        const data = await response.json();
        if(data && typeof data==='object' && data.error) throw new Error(String(data.error.message||data.error));
        return data;
      } finally { clearTimeout(timer); }
    }
    async function geocode(query) {
      return stationCandidates(await fetchJSON(GEOCODE_ENDPOINT,{text:query,type:'STOP',language:'de'},15000));
    }
    // /plan erst nach 15 Min. wieder abfragen, und nur falls die Abfahrtstafel
    // eine feste Route nicht bereits über nextStops identifizieren kann.
    async function findDirectJourney(route) {
      const from=stopById(route.from),to=stopById(route.to);
      if(!from||!to||from.api!=='transitous'||to.api!=='transitous') return null;
      const cached=state.planCache.get(route.id);
      if(cached && Date.now()-cached.at<PLAN_COOLDOWN) return cached.entry;
      state.planCache.set(route.id,{at:Date.now(),entry:null});
      const params={fromPlace:from.id,toPlace:to.id,maxTransfers:'0',timetableView:'true',searchWindow:String(Math.round(2*manualWindowMs()/1000)),time:new Date(Date.now()-manualWindowMs()).toISOString(),language:'de'};
      const result=await fetchJSON(PLAN_ENDPOINT,params,20000);
      const entries=[];
      for(const itinerary of result?.itineraries||[]) {
        const transit=(itinerary.legs||[]).filter(l=>
          !['WALK','BIKE','CAR','RENTAL','CAR_PARKING','CAR_DROPOFF'].includes(String(l.mode||'')));
        if(transit.length!==1) continue;
        const leg=transit[0];
        if(!sameStop(leg.from,from)||!sameStop(leg.to,to)) continue;
        const normalized=normalizeStopTime({
          mode:leg.mode,displayName:leg.displayName,routeShortName:leg.routeShortName,
          tripId:leg.tripId,tripShortName:leg.tripShortName,headsign:leg.headsign,
          tripTo:leg.tripTo||leg.to,realTime:leg.realTime,cancelled:leg.cancelled,
          place:{departure:leg.startTime,scheduledDeparture:leg.scheduledStartTime,
            track:leg.from?.track,scheduledTrack:leg.from?.scheduledTrack},
          nextStops:[leg.to]
        });
        if(isMode(normalized,route.mode) && inManualWindow(normalized)) {
          normalized._routeId=route.id;
          normalized._fromJourney=true;
          entries.push(normalized);
        }
      }
      entries.sort((a,b)=>timeOf(a)-timeOf(b));
      const entry=entries[0]||null;
      state.planCache.set(route.id,{at:Date.now(),entry});
      return entry;
    }
    async function loadManualProjections(id, board) {
      const from = stopById(id);
      if (!from) return;
      const routes = state.routes.filter(r => String(r.from) === String(id));
      if (!routes.length) {state.projections.delete(String(id));return;}
      const projections = [];
      for (const route of routes) {
        if (!stopById(route.to)) continue;
        const hasMatch = board.some(d => inManualWindow(d) && isMode(d,route.mode) && getDirectTarget(d,from,stopById(route.to)));
        if (hasMatch) continue;
        try {
          const extra = await findDirectJourney(route);
          if (extra && stopById(id)) projections.push(extra);
        } catch (error) {
          console.info('Route konnte nicht abgefragt werden:',statusText(error));
        }
      }
      state.projections.set(String(id),projections);
    }
    async function loadStop(id) {
      id=String(id);
      const stop=stopById(id);
      if(state.loading.has(id)||!stop) return;
      if(stop.api!=='transitous') {
        state.errors.set(id,'Haltestelle der alten API: bitte neu zuordnen.');
        renderApp();return;
      }
      state.loading.add(id);state.errors.delete(id);renderApp();
      try {
        const hasManualRoutes=state.routes.some(route=>String(route.from)===id);
        const lookbackMs=hasManualRoutes ? manualWindowMs() : 0;
        const lookaheadMs=hasManualRoutes ? Math.max(AUTO_WINDOW,manualWindowMs()) : AUTO_WINDOW;
        const params={stopId:id,n:String(STOPTIMES_COUNT),
          window:String(Math.round((lookbackMs+lookaheadMs)/1000)),fetchStops:'true',language:'de'};
        if(hasManualRoutes) {
          // Ohne diesen Blick zurück verschwinden verspätete, planmäßig
          // bereits abgefahrene Verbindungen aus der API-Abfahrtstafel.
          params.time=new Date(Date.now()-lookbackMs).toISOString();
          params.realtimeMode='REALTIME_ANNOTATION_ONLY';
        }
        let data;
        try { data=await fetchJSON(STOPTIMES_ENDPOINT,params,18000); }
        catch(error) {
          // `fetchStops` ist experimentell; eine nicht unterstützende Version
          // darf die normale Abfahrtstafel nicht komplett blockieren.
          if(error.status!==400) throw error;
          delete params.fetchStops;
          data=await fetchJSON(STOPTIMES_ENDPOINT,params,18000);
        }
        if(!stopById(id)) return;
        const board=normalizeBoard(data);
        state.boards.set(id,board);
        state.timestamps.set(id,Date.now());
        renderApp();
        await loadManualProjections(id,board);
      } catch(error) {if(stopById(id)) state.errors.set(id,statusText(error));}
      finally {state.loading.delete(id);renderApp();}
    }
    async function loadArrivals(id) {
      id=String(id);
      const stop=stopById(id);
      if(state.arriving.has(id)||!stop||stop.api!=='transitous')return;
      state.arriving.add(id);state.arrivalErrors.delete(id);renderApp();
      try {
        // Für Ankünfte bedeutet "EARLIER": alle Fahrten vor der Zeitgrenze.
        // Zeitgrenze = jetzt + 90 Min.; alte Ankünfte werden clientseitig entfernt.
        const time=new Date(Date.now()+BOARD_DURATION_MIN*60000).toISOString();
        const data=await fetchJSON(STOPTIMES_ENDPOINT,{stopId:id,n:String(STOPTIMES_COUNT),arriveBy:'true',direction:'EARLIER',time,window:'5400',fetchStops:'true',language:'de'},18000);
        if(stopById(id)) state.arrivals.set(id,normalizeBoard(data,true));
      } catch(error) {if(stopById(id)) state.arrivalErrors.set(id,statusText(error));}
      finally {state.arriving.delete(id);renderApp();}
    }
    function replacementScore(original,candidate) {
      const a=stationKey(original.name),b=stationKey(candidate.name);
      if(!a||!b) return -1;
      // Do not silently associate an ambiguous stop with the wrong city.
      if(a!==b) return -1;
      const city=stationKey(original.city);
      const regions=(candidate.areas||[]).map(area=>stationKey(area.name));
      const cityMatches=city && (b.includes(city)||regions.some(region=>region===city||region.includes(city)));
      const closeToOriginal=distanceMeters(original,candidate)<1800;
      // Eindeutige Namen allein reichen für häufige Bezeichnungen wie "Rathaus" nicht.
      // Ist eine Stadt hinterlegt, benötigen wir eine passende Ortsangabe oder Koordinate.
      if(city && !cityMatches && !closeToOriginal) return -1;
      return 100+(cityMatches?20:0)+(closeToOriginal?15:0)
        +(candidate.country==='DE'?5:0)+(candidate.importance||0);
    }
    async function migrateLegacyStops() {
      const old=state.stops.filter(s=>s.api!=='transitous');
      if(!old.length) {if(state.stops.length)refreshAll(true);return;}
      state.migrating=true;renderApp();
      let offlineMessage='';
      for(const stop of old) {
        if(offlineMessage) {state.errors.set(stop.id,offlineMessage);continue;}
        try {
          let list=await geocode(stop.name);
          let ranked=list.map(candidate=>({candidate,score:replacementScore(stop,candidate)}))
            .filter(x=>x.score>=100).sort((a,b)=>b.score-a.score);
          if(!ranked.length && stop.city && !stationKey(stop.name).includes(stationKey(stop.city))) {
            list=await geocode(`${stop.city} ${stop.name}`);
            ranked=list.map(candidate=>({candidate,score:replacementScore(stop,candidate)}))
              .filter(x=>x.score>=100).sort((a,b)=>b.score-a.score);
          }
          const match=ranked[0]?.candidate;
          if(!match||state.stops.some(s=>s!==stop && s.id===String(match.id))) {
            state.errors.set(stop.id,'Alte Haltestellen-ID. Bitte neu zuordnen.');
            continue;
          }
          const oldId=stop.id;
          Object.assign(stop,{id:String(match.id),name:match.name,lat:match.lat,lon:match.lon,api:'transitous'});
          for(const route of state.routes) {
            if(route.from===oldId)route.from=stop.id;
            if(route.to===oldId)route.to=stop.id;
          }
          state.errors.delete(oldId);
        } catch(error) {
          offlineMessage=`Migration nicht möglich: ${statusText(error)} Bitte später neu zuordnen.`;
          state.errors.set(stop.id,offlineMessage);
        }
      }
      state.migrating=false;persist();renderApp();
      if(state.stops.some(s=>s.api==='transitous'))refreshAll(true);
    }
    async function refreshAll(force = false) {
      if(state.busy||state.migrating) return;
      const existing=state.stops.filter(s=>s.api==='transitous').map(s=>s.id);
      if(!existing.length) {state.lastRefresh=Date.now();renderApp();return;}
      if(!force && Date.now()-state.lastRefresh<REFRESH_INTERVAL) return;
      state.busy=true;state.lastRefresh=Date.now();renderApp();
      let position=0;
      const worker=async()=>{while(position<existing.length){await loadStop(existing[position++]);}};
      try {await Promise.all(Array.from({length:Math.min(2,existing.length)},worker));}
      finally {
        state.busy=false;renderApp();
        if(state.activeStopId && state.view==='detail')loadArrivals(state.activeStopId);
        if(state.pendingPriorityRefresh) {
          state.pendingPriorityRefresh=false;
          refreshAll(true);
        }
      }
    }

      const error=arrival?state.arrivalErrors.get(stop.id):state.errors.get(stop.id);
      const known=arrival?state.arrivals.has(stop.id):state.boards.has(stop.id);
      let content='';
      if(items.length) content=items.map((d,i)=>renderBoardRow(d,arrival,stop,i)).join('');
      else if(loading) content=`<div class="board-small-message">${icon('refresh')}Abfahrtstafel wird geladen …</div>`;
      else if(error) content=`<div class="board-small-message">${icon('alert')}${esc(error)}<br><button type="button" class="btn small" data-action="refresh" style="margin-top:15px">Erneut versuchen</button></div>`;
      else content=`<div class="board-small-message">${icon('clock')}${known?'Keine Fahrten im angefragten Zeitraum.':'Keine Daten vorhanden.'}</div>`;
      return `<div class="board-panel"><div class="board-panel-top"><div class="segmented" role="tablist" aria-label="Abfahrtstafel">
        <button type="button" role="tab" aria-selected="${!arrival}" class="${!arrival?'active':''}" data-action="detail-tab" data-tab="departures">Abfahrten</button>
        <button type="button" role="tab" aria-selected="${arrival}" class="${arrival?'active':''}" data-action="detail-tab" data-tab="arrivals">Ankünfte</button>
        </div><span class="board-count">${items.length} Einträge</span></div>
        ${error&&items.length?`<div class="warn-strip" style="margin:14px">${esc(error)} – ältere Daten werden angezeigt.</div>`:''}
        <div role="tabpanel">${content}</div>
        <div class="board-bottom"><span>${icon('clock','sm')} Zeitangaben inkl. verfügbarer Echtzeitdaten</span><span>90-Min.-Fenster</span></div>
      </div>`;
    }
    function renderDetail() {
      const stop=stopById(state.activeStopId);if(!stop)return renderHome();
      const selected=chooseDeparture(stop), dep=selected?.entry;
      const next=dep?fmtTime(timeOf(dep)):'–:–';
      const count=(state.boards.get(stop.id)||[]).filter(isFuture).length;
      const priority=selected?.kind==='manual'?'Feste Verbindung':selected?.kind==='automatic'?'Direktverbindung':'Nächste Fahrt';
      return `<button type="button" class="detail-back" data-action="nav" data-view="home">${icon('arrowLeft','sm')} Alle Haltestellen</button>
        <div class="detail-head"><div><div class="detail-label">HALTESTELLE IM DETAIL</div><h1>${esc(stop.name)}</h1><p>${icon('pin','sm')}${esc(stop.city||'Ort unbekannt')}</p></div>
        <div class="detail-tools"><button type="button" class="icon-btn" data-action="edit-city" data-id="${esc(stop.id)}" aria-label="Stadt bearbeiten" title="Stadt bearbeiten">${icon('edit','sm')}</button>
          <button type="button" class="icon-btn" data-action="remove-stop" data-id="${esc(stop.id)}" aria-label="Haltestelle entfernen" title="Haltestelle entfernen">${icon('trash','sm')}</button></div></div>
        <div class="detail-metrics">${renderMetric('Nächste Abfahrt',next,dep ? priority:'Noch keine Fahrt')}
          ${renderMetric('In den nächsten 90 Min.',String(count),'Abfahrten gefunden')}
          ${renderMetric('Aktuelle Uhrzeit',fmtTime(Date.now()),'Lokale Zeit')}</div>
        ${renderBoard(stop)}<div class="notice">${icon('info')}<div>Die Daten kommen vom öffentlichen Verkehrsdatenanbieter. Einzelne Verkehrsunternehmen, Echtzeitinformationen oder Zwischenhalte können fehlen. Angezeigte Zeiten bitte vor Fahrtantritt prüfen.</div></div>`;
    }
    function renderRoutes() {
      const routes=state.routes.length?`<div class="route-list">${state.routes.map(r=>`<article class="route-card">
        <div class="route-content"><div class="route-symbol">${icon('arrows')}</div><div><div class="route-primary"><span>${esc(stopById(r.from)?.name||'Unbekannt')}</span>${icon('arrowRight','sm')}<span>${esc(stopById(r.to)?.name||'Unbekannt')}</span></div>
          <div class="route-secondary">${esc(modeLabel(r.mode))} · Priorität bei passenden Abfahrten</div></div></div>
        <button type="button" class="icon-btn borderless" data-action="remove-route" data-id="${esc(r.id)}" title="Verbindung entfernen" aria-label="Verbindung entfernen">${icon('trash','sm')}</button>
      </article>`).join('')}</div>`:`<div class="empty-state" style="margin-top:27px"><div class="empty-icon">${icon('star')}</div><h3>Hier fahren deine Favoriten.</h3>
        <p>Lege Start, Ziel und Verkehrsmittel fest, um diese Verbindung bei passenden Abfahrten besonders zu berücksichtigen.</p>
        <button type="button" class="btn primary" data-action="add-route">${icon('plus','sm')} Verbindung anlegen</button></div>`;
      return `<div class="detail-label">PERSONALISIERUNG</div><h1 class="routes-page-title">Meine Verbindungen</h1>
        <div class="priority-window"><div><label class="priority-window-label" for="priority-window-select">Priorität rund um die geplante Abfahrt</label>
          <p class="priority-window-help">Gilt jeweils vor und nach der planmäßigen Abfahrtszeit. Verspätete Fahrten bleiben bevorzugt, solange sie noch nicht abgefahren sind.</p></div>
          <select id="priority-window-select" class="form-select" aria-label="Zeitraum für feste Verbindungen">
            ${PRIORITY_WINDOWS.map(minutes=>`<option value="${minutes}" ${minutes===state.priorityMinutes?'selected':''}>± ${minutes} Minuten</option>`).join('')}
          </select></div>
        <div class="section-heading"><div><h2 class="section-title">Gespeicherte Verbindungen</h2><p class="section-desc">${state.routes.length} Verbindungen aktiv</p></div>
          ${state.stops.length>=2?`<button type="button" class="btn primary" data-action="add-route">${icon('plus','sm')} Neu anlegen</button>`:''}</div>
        ${state.stops.length<2?`<div class="notice">${icon('info')}<span>Um eine regelmäßige Verbindung anzulegen, speichere zuerst mindestens zwei Haltestellen.</span></div>`:''}
        ${routes}<section class="rule-list"><h3>So funktioniert die Priorisierung</h3>
          <div class="rule-row"><span class="rule-num">1</span><div><strong>Feste Verbindungen</strong><p>Deine gespeicherte Kombination aus Start, Ziel und Verkehrsmittel hat Vorrang, wenn die planmäßige Abfahrt höchstens ${state.priorityMinutes} Minuten zurückliegt oder bevorsteht und die Fahrt noch nicht abgefahren ist.</p></div></div>
          <div class="rule-row"><span class="rule-num">2</span><div><strong>Automatisch erkannte Ziele</strong><p>Fahrten zu einer weiteren gespeicherten Haltestelle werden innerhalb der nächsten 30 Minuten vorgezogen.</p></div></div>
          <div class="rule-row"><span class="rule-num">3</span><div><strong>Nächste reguläre Abfahrt</strong><p>Wenn nichts davon passt, erscheint die zeitlich nächste Fahrt.</p></div></div>
        </section>`;
    }
    function renderApp() {
      const app=el('app');if(!app)return;
      app.innerHTML=`<div class="app-layout">${renderSidebar()}<main class="main">${renderMobileHeader()}${renderTopline()}${state.view==='detail'?renderDetail():state.view==='routes'?renderRoutes():renderHome()}<footer class="api-attribution">Daten: <a href="https://transitous.org/" target="_blank" rel="noopener noreferrer">Transitous</a> · <a href="https://transitous.org/sources/" target="_blank" rel="noopener noreferrer">Datenquellen</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap-Mitwirkende</a><br>Gemeinschaftsdienst, nicht für kommerzielle Nutzung. Echtzeitdaten je nach Anbieter.</footer></main></div>${renderBottomNav()}`;
    }
    function openModal(type,id) {
      state.modal={type,id:id||null};state.searchToken++;
      state.selectedCandidate=null;state.searchResults=[];state.searchTerm='';state.searchState='idle';
      renderModal();
      document.body.style.overflow='hidden';
      if(type==='relink-stop') {
        const station=stopById(id);
        if(station) {
          const input=el('station-search');
          if(input){input.value=station.name;input.focus();}
          onSearch(station.name);
        }
      } else if(type==='add-stop') requestAnimationFrame(()=>el('station-search')?.focus());
    }
    function closeModal() {
      state.modal=null;state.searchToken++;clearTimeout(state.searchTimer);document.body.style.overflow='';
      el('modal-root').innerHTML='';
    }
    function renderSearchResults() {
      const results=el('search-results');if(!results)return;
      if(state.searchState==='loading') {results.innerHTML='<div class="search-status">Haltestellen werden gesucht …</div>';return;}
      if(state.searchState==='error') {results.innerHTML=`<div class="search-status">${esc(state.searchError||'Suche nicht verfügbar. Netzwerk prüfen.')}</div>`;return;}
      if(!state.searchTerm.trim()) {results.innerHTML='<div class="search-status">Suche nach einer Haltestelle in Deutschland.</div>';return;}
      if(state.searchTerm.trim().length<2){results.innerHTML='<div class="search-status">Bitte mindestens zwei Zeichen eingeben.</div>';return;}
      if(!state.searchResults.length){results.innerHTML='<div class="search-status">Keine passende Haltestelle gefunden.</div>';return;}
      results.innerHTML=`<div class="search-list">${state.searchResults.map((s,i)=>`<button class="search-result" type="button" data-action="select-candidate" data-index="${i}">
        <span class="search-result-icon">${icon('train','sm')}</span><span><strong>${esc(s.name)}</strong><small>${esc(guessCity(s))}${state.stops.some(x=>x.id===String(s.id))?' · Bereits gespeichert':''}</small></span>
        <span class="result-side">${icon('chevronRight','sm')}</span></button>`).join('')}</div>`;
    }
    function renderModal() {
      if(!state.modal)return;
      const type=state.modal.type;
      let heading='',kicker='',body='';
      if(type==='add-stop'||type==='relink-stop') {
        kicker=type==='relink-stop'?'ALTE HALTESTELLE AKTUALISIEREN':'HALTESTELLE SPEICHERN';
        heading=state.selectedCandidate?'Haltestelle übernehmen':type==='relink-stop'?'Haltestelle neu zuordnen':'Wohin soll es gehen?';
        if(state.selectedCandidate) {
          const chosen=state.selectedCandidate;
          body=`<p class="modal-help">Prüfe den Ortsnamen. Du kannst ihn ändern, falls er nicht richtig erkannt wurde.</p>
          <div class="selected-stop">${icon('check')}<div><strong>${esc(chosen.name)}</strong><small>Haltestelle ausgewählt</small></div></div>
          <div class="form-group"><label class="form-label" for="city-input">Stadt / Ort</label><input id="city-input" class="form-input" maxlength="100" autocomplete="off" value="${esc(type==='relink-stop' ? stopById(state.modal?.id)?.city||guessCity(chosen):guessCity(chosen))}"></div>
          <div class="modal-actions"><button class="btn ghost" type="button" data-action="back-search">Zurück</button><button class="btn primary" type="button" data-action="save-stop">${icon('plus','sm')} Speichern</button></div>`;
        } else {
          body=`<p class="modal-help">Suche nach einer Bahn-, S-Bahn-, Bus- oder Straßenbahnhaltestelle. Die App verwendet die öffentlich verfügbaren Daten.</p>
            <div class="form-group"><label class="form-label" for="station-search">Haltestelle suchen</label><div class="input-wrap">${icon('search')}
              <input class="form-input" id="station-search" type="search" autocomplete="off" spellcheck="false" placeholder="z. B. Wismar, Hamburg Hbf …" value="${esc(state.searchTerm)}"></div></div>
            <div id="search-results" aria-live="polite"></div>`;
        }
      } else if(type==='add-route') {
        kicker='FESTE PRIORITÄT';heading='Verbindung speichern';
        const options=state.stops.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${esc(s.city||'')}</option>`).join('');
        const optionTo=state.stops.map((s,i)=>`<option value="${esc(s.id)}" ${i===1?'selected':''}>${esc(s.name)} · ${esc(s.city||'')}</option>`).join('');
        body=`<p class="modal-help">Lege fest, welche Direktverbindung auf deinem Dashboard bevorzugt angezeigt werden soll.</p>
          <form id="route-form"><div class="form-group"><label class="form-label" for="route-from">Start</label><select class="form-select" id="route-from" name="from" required>${options}</select></div>
          <div class="form-group"><label class="form-label" for="route-to">Ziel</label><select class="form-select" id="route-to" name="to" required>${optionTo}</select></div>
          <div class="form-group"><label class="form-label" for="route-mode">Verkehrsmittel</label><select class="form-select" id="route-mode" name="mode">${MODES.map(([id,name])=>`<option value="${esc(id)}">${esc(name)}</option>`).join('')}</select></div>
          <p class="small-note">Es werden nur direkte Fahrten berücksichtigt, die zum gewählten Verkehrsmittel passen.</p>
          <div class="modal-actions" style="margin-top:20px"><button class="btn ghost" type="button" data-action="close-modal">Abbrechen</button><button class="btn primary" type="submit">${icon('star','sm')} Verbindung sichern</button></div></form>`;
      } else if(type==='edit-city') {
        const stop=stopById(state.modal.id);if(!stop){closeModal();return;}
        kicker='HALTESTELLE ANPASSEN';heading='Stadt bearbeiten';
        body=`<p class="modal-help">Haltestelle: <strong>${esc(stop.name)}</strong></p><div class="form-group"><label class="form-label" for="city-input">Stadt / Ort</label>
          <input class="form-input" id="city-input" autocomplete="off" maxlength="100" value="${esc(stop.city||'')}"></div>
          <div class="modal-actions"><button class="btn ghost" type="button" data-action="close-modal">Abbrechen</button><button class="btn primary" type="button" data-action="save-city">${icon('check','sm')} Speichern</button></div>`;
      }
      el('modal-root').innerHTML=`<div class="overlay" data-overlay="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
        <div class="modal-top"><div><div class="modal-kicker">${kicker}</div><h2 id="modal-heading">${heading}</h2></div>
        <button type="button" class="icon-btn borderless" data-action="close-modal" aria-label="Dialog schließen">${icon('close')}</button></div>
        <div class="modal-body">${body}</div></section></div>`;
      if((type==='add-stop'||type==='relink-stop')&&!state.selectedCandidate) renderSearchResults();
    }
    function onSearch(value) {
      state.searchTerm=value;state.searchResults=[];state.searchToken++;
      const token=state.searchToken;
      clearTimeout(state.searchTimer);
      if(value.trim().length<2){state.searchState='idle';renderSearchResults();return;}
      state.searchState='loading';renderSearchResults();
      state.searchTimer=setTimeout(async()=>{
        try {
          const arr=await geocode(value.trim());
          if(token!==state.searchToken||!['add-stop','relink-stop'].includes(state.modal?.type))return;
          state.searchResults=arr.slice(0,9);
          state.searchState='done';renderSearchResults();
        } catch(error) {
          if(token!==state.searchToken)return;
          state.searchError=statusText(error);
          state.searchState='error';renderSearchResults();
        }
      },420);
    }
    function saveCandidate() {
      const candidate=state.selectedCandidate;if(!candidate)return;
      const id=String(candidate.id),old=state.modal?.type==='relink-stop'?stopById(state.modal.id):null;
      if(stopById(id) && stopById(id)!==old){toast('Diese Haltestelle ist bereits gespeichert.',true);return;}
      const city=(el('city-input')?.value||guessCity(candidate)).trim().slice(0,100)||guessCity(candidate);
      if(old) {
        const oldId=old.id;
        Object.assign(old,{id,name:String(candidate.name),city,lat:candidate.lat,lon:candidate.lon,api:'transitous'});
        state.errors.delete(oldId);
        for(const route of state.routes) {
          if(route.from===oldId)route.from=id;
          if(route.to===oldId)route.to=id;
        }
        state.projections.clear();state.planCache.clear();
      } else state.stops.push({id,name:String(candidate.name),city,lat:candidate.lat,lon:candidate.lon,api:'transitous'});
      state.lastRefresh=Date.now();persist();closeModal();showView('home');
      toast(old?'Haltestelle erfolgreich neu zugeordnet.':'Haltestelle gespeichert.');
      loadStop(id);
    }
    function saveCity() {
      const stop=stopById(state.modal?.id);if(!stop)return;
      const value=(el('city-input')?.value||'').trim();if(!value){toast('Bitte Stadt oder Ort angeben.',true);return;}
      stop.city=value.slice(0,100);persist();closeModal();renderApp();toast('Ort aktualisiert.');
    }
    function saveRoute(event) {
      event.preventDefault();
      const form=el('route-form');if(!form)return;
      const data=new FormData(form),from=String(data.get('from')||''),to=String(data.get('to')||''),mode=String(data.get('mode')||'all');
      if(!stopById(from)||!stopById(to)||from===to){toast('Start und Ziel müssen verschieden sein.',true);return;}
      if(!Object.prototype.hasOwnProperty.call(PRODUCT_FILTERS,mode)){toast('Ungültiges Verkehrsmittel.',true);return;}
      if(state.routes.some(r=>r.from===from&&r.to===to&&r.mode===mode)){toast('Diese Verbindung gibt es bereits.',true);return;}
      if(stopById(from).api!=='transitous'||stopById(to).api!=='transitous') {
        toast('Bitte zuerst die Haltestellen der alten API neu zuordnen.',true);return;
      }
      state.routes.push({id:uid(),from,to,mode});persist();closeModal();showView('routes');toast('Verbindung gespeichert.');
      refreshAll(true);
    }
    document.addEventListener('click',event=>{
      if(event.target?.dataset?.overlay==='true'){closeModal();return;}
      const node=event.target.closest('[data-action]');if(!node)return;
      const action=node.dataset.action,id=node.dataset.id;
      if(['nav','add-stop','add-route','open-stop','edit-city','relink-stop','remove-stop','remove-route','close-modal','back-search','select-candidate','save-stop','save-city','detail-tab','refresh'].includes(action)) event.preventDefault();
      switch(action) {
        case 'nav':showView(node.dataset.view);break;
        case 'add-stop':openModal('add-stop');break;
        case 'add-route':if(state.stops.length<2){toast('Bitte zuerst zwei Haltestellen speichern.',true);return;}openModal('add-route');break;
        case 'open-stop':openStop(id);break;
        case 'edit-city':openModal('edit-city',id);break;
        case 'relink-stop':openModal('relink-stop',id);break;
        case 'remove-stop':removeStop(id);break;
        case 'remove-route':removeRoute(id);break;
        case 'close-modal':closeModal();break;
        case 'back-search':state.selectedCandidate=null;renderModal();requestAnimationFrame(()=>el('station-search')?.focus());break;
        case 'select-candidate':state.selectedCandidate=state.searchResults[Number(node.dataset.index)]||null;renderModal();break;
        case 'save-stop':saveCandidate();break;
        case 'save-city':saveCity();break;
        case 'detail-tab':state.detailTab=node.dataset.tab;renderApp();break;
        case 'refresh':refreshNow();break;
      }
    });
    document.addEventListener('input',event=>{
      if(event.target.id==='station-search')onSearch(event.target.value);
    });
    document.addEventListener('change',event=>{
      if(event.target.id!=='priority-window-select')return;
      const minutes=Number(event.target.value);
      if(!PRIORITY_WINDOWS.includes(minutes) || minutes===state.priorityMinutes)return;
      state.priorityMinutes=minutes;
      state.planCache.clear();
      state.projections.clear();
      persist();renderApp();
      if(state.stops.length) {
        if(state.busy)state.pendingPriorityRefresh=true;
        else refreshAll(true);
      }
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&state.modal)closeModal();
      if(event.key==='Enter'&&event.target.id==='station-search'&&state.searchResults.length){
        event.preventDefault();state.selectedCandidate=state.searchResults[0];renderModal();
      }
      if(event.key==='Enter'&&event.target.id==='city-input'){
        event.preventDefault();if(['add-stop','relink-stop'].includes(state.modal?.type))saveCandidate();else if(state.modal?.type==='edit-city')saveCity();
      }
    });
    document.addEventListener('submit',event=>{
      if(event.target?.id==='route-form')saveRoute(event);
    });
    window.addEventListener('online',()=>{renderApp();refreshAll(true);});
    window.addEventListener('offline',renderApp);
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible'){updateClocks();refreshAll(false);}
    });
    setInterval(()=>{
      if(document.visibilityState!=='visible')return;
      updateClocks();
      if(Date.now()-state.lastRefresh>=REFRESH_INTERVAL)refreshAll(false);
    },15000);
    renderApp();
    if(state.stops.length)migrateLegacyStops();
  })();
  </script>
</body>
</html>
