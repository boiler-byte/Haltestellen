<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f19">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Haltestellen">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Deine Haltestellen auf einen Blick. Echtzeit-Abfahrten, Ankünfte und intelligente Lieblingsverbindungen.">
  <title>Haltestellen – Dein ÖPNV auf einen Blick</title>
  <!--
    Haltestellen v7 – privater, nichtkommerzieller Open-Source-Prototyp (MIT-Lizenz).
    Daten: Transitous/MOTIS 2, OpenStreetMap und die jeweiligen Verkehrsanbieter.
    Transitous erlaubt leichte Prototyp-Tests. Bei Veröffentlichung gelten
    https://transitous.org/api/ : Quellcode, Attribution, Website mit Kontakt,
    nichtkommerzielle Nutzung und sparsamer Umgang mit Anfragen.
    Für den dauerhaften Betrieb auf einer HTTPS-Seite hosten: file:// sendet
    keinen verwertbaren Referer und kann je nach Browser CORS-Probleme auslösen.
  -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f19;
      --bg-soft: #101723;
      --surface: #141d2b;
      --surface-2: #1a2535;
      --surface-3: #213149;
      --line: #273347;
      --line-strong: #35445a;
      --text: #f2f6fc;
      --muted: #96a6bb;
      --muted-2: #708298;
      --accent: #a5ffb8;
      --accent-ink: #092514;
      --blue: #8cbeff;
      --orange: #ffbd86;
      --red: #ff969a;
      --shadow: 0 20px 60px rgba(0,0,0,.18);
      --radius: 24px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    body::before { content: ""; z-index: -1; pointer-events: none; position: fixed; inset: 0; background: radial-gradient(circle at 87% 0, rgba(61,101,139,.13), transparent 35%), radial-gradient(circle at 0 75%, rgba(35,74,74,.09), transparent 45%); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button, input, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex="0"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    a { color: inherit; }
    .icon { width: 19px; height: 19px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; }
    .icon.sm { width: 16px; height: 16px; }
    .icon.lg { width: 22px; height: 22px; }
    .app-layout { width: 100%; max-width: 1320px; padding: 32px 36px 64px; margin: 0 auto; display: grid; grid-template-columns: 244px minmax(0,1fr); gap: clamp(26px,4.6vw,70px); }
    .sidebar { height: calc(100vh - 64px); min-height: 520px; position: sticky; top: 32px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 13px; text-decoration: none; font-size: 26px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; }
    .brand-mark { width: 39px; height: 39px; flex: 0 0 39px; border-radius: 13px; display: grid; place-items: center; background: var(--accent); color: #0c2b18; transform: rotate(-8deg); box-shadow: 0 7px 22px rgba(165,255,184,.12); }
    .brand-mark svg { transform: rotate(8deg); }
    .sidebar-caption { color: var(--muted-2); text-transform: uppercase; letter-spacing: .17em; font-weight: 750; font-size: 10px; margin: 76px 12px 17px; }
    .side-nav { display: grid; gap: 9px; }
    .nav-button { display:flex; align-items:center; gap: 13px; width:100%; border:1px solid transparent; border-radius:14px; padding: 15px 15px; text-align:left; background:transparent; color:var(--muted); font-weight:650; transition: .17s ease; }
    .nav-button:hover { background:rgba(255,255,255,.04); color:var(--text); }
    .nav-button.active { background:#1c2a32; border-color:#2e4544; color:var(--accent); }
    .nav-count { margin-left:auto; border-radius:9px; padding:1px 8px; background:rgba(255,255,255,.06); font-size:11px; color:var(--muted); font-weight:750; }
    .api-attribution { color:var(--muted-2); font-size:11px; line-height:1.75; margin:34px 0 0; padding:17px 0; border-top:1px solid var(--line); }
    .api-attribution a { color:var(--muted); text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:3px; }
    .relink-btn { margin-top:12px; padding:8px 11px; border:1px solid var(--line-strong); background:var(--surface-3); border-radius:10px; color:var(--accent); font-size:12px; font-weight:720; }
    .main { min-width:0; padding-top: 8px; }
    .mobile-header { display:none; }
    .topline { display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:29px; margin-bottom:27px; }
    .date-label { color:var(--muted); font-size:13px; font-weight:590; letter-spacing:.01em; }
    .top-right { display:flex; align-items:center; gap:10px; }
    .status-online { display:inline-flex; align-items:center; gap:7px; padding:7px 11px; border:1px solid var(--line); border-radius:100px; color:var(--muted); font-size:11px; font-weight:700; white-space:nowrap; }
    .live-dot { width:7px; height:7px; background:var(--accent); border-radius:50%; display:inline-block; box-shadow:0 0 0 4px rgba(165,255,184,.08); }
    .status-online.offline .live-dot { background:var(--red); box-shadow:none; }
    .icon-btn { display:inline-grid; place-items:center; flex:0 0 auto; width:40px; height:40px; color:var(--muted); border:1px solid var(--line); background:var(--surface); border-radius:12px; transition: .15s; }
    .icon-btn:hover { background:var(--surface-3); color:var(--text); border-color:var(--line-strong); }
    .icon-btn.borderless { border-color: transparent; background:transparent; }
    .icon-btn.borderless:hover { background:rgba(255,255,255,.07); }
    .spin .icon { animation:spin .85s linear infinite; }
    @keyframes spin { to {transform:rotate(360deg)} }
    .section-heading { display:flex; justify-content:space-between; align-items:center; gap:20px; margin:36px 0 17px; }
    .section-title { margin:0; font-size:20px; font-weight:760; letter-spacing:-.6px; }
    .home-heading { margin-top:9px; }
    .heading-inline { display:inline-flex; align-items:center; gap:10px; }
    .section-count { display:inline-grid; place-items:center; min-width:27px; height:25px; padding:0 8px; border-radius:9px; background:#22343b; border:1px solid #36504d; color:var(--accent); font-size:12px; font-weight:780; letter-spacing:0; }
    .section-desc { font-size:12px; color:var(--muted); margin:5px 0 0; }
    .section-actions { display:flex; gap:9px; align-items:center; }
    .btn { border-radius:12px; padding:12px 17px; display:inline-flex; align-items:center; justify-content:center; gap:9px; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--text); font-size:13px; font-weight:750; white-space:nowrap; text-decoration:none; min-height:43px; transition:.15s; }
    .btn:hover { background:#253346; border-color:#526579; transform:translateY(-1px); }
    .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
    .btn.primary:hover { background:#c0ffd0; border-color:#c0ffd0; }
    .btn.soft { background:#1c2c34; color:var(--accent); border-color:#36504b; }
    .btn.ghost { background:transparent; border-color:var(--line); color:var(--muted); }
    .btn.full { width:100%; }
    .btn.small { min-height:36px; padding:8px 12px; font-size:12px; }
    .stop-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .stop-card { overflow:hidden; border:1px solid #2a394c; border-radius:18px; background:linear-gradient(155deg, #1a2738, #151e2c 72%); min-height:0; display:flex; flex-direction:column; transition:border-color .15s, transform .15s, box-shadow .15s; }
    .stop-card:hover { border-color:#4a6672; transform:translateY(-2px); box-shadow:0 16px 38px rgba(0,0,0,.14); }
    .stop-card[data-index="1"] { background:linear-gradient(155deg,#24283a,#171e2d 72%); }
    .stop-card[data-index="2"] { background:linear-gradient(155deg,#1b2e35,#151f2c 72%); }
    .stop-card[data-index="3"] { background:linear-gradient(155deg,#282b36,#181e2b 72%); }
    .stop-card { -webkit-touch-callout:none; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
    .stop-card.drag-placeholder { opacity:.28; border:2px dashed var(--accent); box-shadow:none; }
    .stop-grid.is-sorting { cursor:grabbing; }
    .sorting-stops, .sorting-stops * { user-select:none!important; -webkit-user-select:none!important; }
    .stop-card.drag-ghost { position:fixed; z-index:50; pointer-events:none; margin:0; opacity:.96; box-shadow:0 24px 65px rgba(0,0,0,.65); border-color:var(--accent); transform-origin:center; transition:none; }
    .stop-card.drag-ghost:hover { box-shadow:0 24px 65px rgba(0,0,0,.65); }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:15px 18px 0; }
    .card-station { min-width:0; }
    .card-station-name { margin:0; font-size:19px; line-height:1.2; letter-spacing:-.6px; font-weight:780; overflow-wrap:anywhere; }
    .card-city { display:flex; align-items:center; gap:5px; margin:3px 0 0; font-size:11px; color:var(--muted); }
    .card-body-btn { text-align:left; width:100%; padding:8px 18px 13px; display:flex; flex-direction:column; flex:1; background:transparent; border:none; color:inherit; }
    .card-overline { text-transform:uppercase; color:var(--muted); font-size:9px; font-weight:800; letter-spacing:.12em; display:flex; align-items:center; gap:6px; margin-bottom:5px; }
    /* Markierung der bevorzugten Fahrt ohne eigene Textzeile. */
    .stop-card.priority-manual { border-color:#426d59; }
    .stop-card.priority-automatic { border-color:#3b5975; }
    .trip-priority { display:inline-grid; place-items:center; flex:0 0 25px; width:25px; height:25px; border-radius:8px; border:1px solid transparent; }
    .trip-priority .icon { width:15px; height:15px; }
    .trip-priority.manual { color:var(--accent); background:#253f36; border-color:#3b6752; }
    .trip-priority.automatic { color:var(--blue); background:#22354a; border-color:#355673; }
    .card-main-row { display:flex; align-items:baseline; gap:8px; min-width:0; }
    .card-platform { display:inline-flex; flex:0 0 auto; align-items:center; justify-content:center; margin-left:auto; align-self:center; padding:5px 9px; border:1px solid #3b5061; border-radius:9px; background:#223346; color:#d3e1f1; white-space:nowrap; font-size:12px; line-height:1.15; font-weight:800; font-variant-numeric:tabular-nums; }
    .card-platform.changed { color:var(--red); border-color:#87444d; background:#3b252e; }
    .platform-indicator.changed { color:var(--red); font-weight:800; }
    .db-panel { margin-top:12px; }
    .db-panel .db-data-status { margin-top:5px; }
    .db-data-status.success { color:var(--accent); }
    .db-data-status.error { color:var(--red); }
    .db-help-link { color:var(--blue); text-decoration:underline; text-underline-offset:3px; }
    .db-checkbox { display:flex; align-items:center; gap:9px; margin:15px 0; color:var(--muted); font-size:12px; }
    .db-checkbox input { width:17px; height:17px; accent-color:var(--accent); }
    .db-modal-actions { display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-top:15px; }
    .db-modal-actions .btn { flex:1 0 auto; }
    #db-test-result { margin:11px 0 0; font-size:12px; color:var(--muted); }
    .mins-big { font-size:clamp(38px,4.6vw,49px); font-weight:790; line-height:1; letter-spacing:-2.4px; }
    .mins-unit { color:var(--muted); font-size:15px; font-weight:600; }
    .card-trip { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:9px; min-width:0; }
    .line-badge { border-radius:8px; display:inline-flex; align-items:center; justify-content:center; min-width:43px; padding:4px 7px; line-height:1.3; background:#c4d9fa; color:#14243e; font-weight:850; letter-spacing:-.2px; font-size:11px; white-space:nowrap; }
    .line-badge.bus { background:#d2beff; color:#302052; }
    .line-badge.rail { background:#b4dafa; color:#143150; }
    .line-badge.tram { background:#f7c9a8; color:#512f1b; }
    .line-badge.subway { background:#fac1cb; color:#4d2030; }
    .line-badge.other { background:#c4ebde; color:#193e32; }
    .trip-direction { color:#d8e1ee; font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:70px; }
    /* Abfahrtszeit und Ankunftszeit erhalten dieselbe Status-Farbgebung. */
    .trip-time { margin-left:auto; color:var(--muted-2); font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .trip-time.ontime { color:var(--accent); }
    .trip-time.late { color:var(--red); }
    .card-arrival { display:flex; align-items:center; gap:6px; min-width:0; margin-top:6px; color:var(--muted); font-size:11px; }
    .card-arrival .icon { opacity:.8; }
    .card-arrival-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
    .card-arrival strong { margin-left:auto; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--muted-2); }
    .card-arrival.ontime strong { color:var(--accent); }
    .card-arrival.late strong { color:var(--red); }
    .muted-italic { color:var(--muted); font-size:13px; }
    .card-empty-state { flex:1; display:flex; align-items:center; gap:11px; color:var(--muted); font-size:13px; line-height:1.5; }
    .warn-strip { padding:10px 13px; background:#3a292c; border:1px solid #71414a; color:#f8b3b5; font-size:12px; border-radius:11px; margin-bottom:15px; }
    .notice { display:flex; gap:11px; align-items:flex-start; padding:17px 19px; background:#141f2a; border:1px solid #263d43; border-radius:15px; color:var(--muted); font-size:12px; line-height:1.65; margin-top:22px; }
    .notice .icon { color:var(--accent); margin-top:1px; }
    .notice strong { color:#e0e9ef; }
    .empty-state { position:relative; overflow:hidden; padding:52px 24px; border:1px dashed #314356; border-radius:24px; background:linear-gradient(145deg,rgba(25,36,52,.85),rgba(16,24,35,.95)); text-align:center; }
    .empty-icon { margin:0 auto 20px; width:71px; height:71px; background:#213b38; display:grid; place-items:center; color:var(--accent); border:1px solid #36544a; border-radius:22px; transform:rotate(-7deg); }
    .empty-icon svg { width:33px; height:33px; transform:rotate(7deg); }
    .empty-state h3 { font-size:20px; letter-spacing:-.5px; margin:0 0 7px; }
    .empty-state p { max-width:390px; margin:0 auto 23px; color:var(--muted); line-height:1.7; font-size:13px; }
    .subsection { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:30px; margin-bottom:12px; }
    .subsection h3 { margin:0; font-size:14px; font-weight:740; letter-spacing:-.2px; }
    .subsection button { border:0; background:transparent; color:var(--accent); font-size:12px; font-weight:750; padding:4px; }
    .routes-strip { display:flex; flex-wrap:wrap; gap:9px; }
    .route-chip { display:inline-flex; align-items:center; gap:8px; max-width:100%; border:1px solid #2f4650; background:#1b2b34; color:#c2ddd7; padding:10px 13px; border-radius:10px; font-size:12px; font-weight:650; }
    .route-chip .icon { color:var(--accent); }
    .route-chip span { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .detail-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
    .detail-head h1 { font-size:clamp(29px,4.6vw,45px); letter-spacing:-1.8px; line-height:1.14; margin:8px 0 7px; overflow-wrap:anywhere; }
    .detail-head p { display:flex; align-items:center; gap:6px; color:var(--muted); margin:0; font-size:13px; }
    .detail-tools { display:flex; gap:8px; margin-top:6px; }
    .detail-metrics { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:27px; }
    .detail-metric { border:1px solid #2c3b4d; background:#172333; border-radius:16px; padding:18px; min-width:0; }
    .detail-metric .mini-label { color:var(--muted); font-size:11px; display:block; margin-bottom:7px; }
    .detail-metric strong { font-size:24px; font-weight:780; letter-spacing:-1px; line-height:1.2; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .detail-metric .mini-sub { display:block; font-size:11px; color:var(--accent); margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .board-panel { border:1px solid var(--line); background:var(--surface); border-radius:22px; overflow:hidden; margin-top:27px; }
    .board-panel-top { padding:19px 22px 17px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .segmented { display:flex; background:#101825; border:1px solid #2c3a4b; border-radius:11px; padding:4px; gap:3px; }
    .segmented button { border:0; background:transparent; border-radius:8px; padding:9px 14px; color:var(--muted); font-size:12px; font-weight:750; }
    .segmented button.active { background:#2a3b4f; color:var(--text); box-shadow:0 3px 9px rgba(0,0,0,.14); }
    .detail-tab-count { display:inline-grid; place-items:center; min-width:22px; height:20px; padding:0 6px; border-radius:7px; background:#25364a; color:var(--muted); font-size:10px; font-weight:800; font-variant-numeric:tabular-nums; }
    .segmented button.active .detail-tab-count { background:#39554c; color:var(--accent); }
    .segmented button { display:inline-flex; align-items:center; justify-content:center; gap:7px; }
    .board-row { display:grid; align-items:center; grid-template-columns:72px minmax(0,1fr) minmax(75px,auto); gap:13px; min-height:78px; padding:14px 22px; border-bottom:1px solid #243043; }
    .board-row:last-child { border-bottom:0; }
    .board-row.highlight { background:rgba(165,255,184,.055); }
    .board-row.cancelled { opacity:.62; }
    .board-middle { overflow:hidden; min-width:0; }
    .board-destination { margin:0; color:var(--text); font-size:13px; font-weight:720; text-overflow:ellipsis; white-space:nowrap; overflow:hidden; }
    .board-meta { display:flex; flex-wrap:wrap; align-items:center; gap:5px 11px; font-size:11px; color:var(--muted); margin-top:5px; }
    .board-meta .fav-via { color:var(--accent); font-weight:700; }
    .board-when { text-align:right; }
    .board-when strong { display:block; color:var(--text); font-size:19px; letter-spacing:-.5px; font-weight:800; font-variant-numeric:tabular-nums; }
    .board-when .delay { font-size:10px; font-weight:720; color:var(--accent); }
    .board-when .delay.late { color:var(--orange); }
    .board-when .delay.cancel { color:var(--red); }
    .board-when .delay.unknown { color:var(--muted-2); }
    .board-small-message { text-align:center; padding:48px 22px; color:var(--muted); font-size:13px; }
    .board-small-message .icon { display:block; margin:0 auto 12px; color:var(--muted-2); width:28px; height:28px; }
    .board-bottom { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 22px; color:var(--muted-2); background:#111a27; font-size:11px; border-top:1px solid var(--line); }
    .routes-page-title { font-size:clamp(29px,4vw,43px); margin:0; letter-spacing:-1.4px; }
    .routes-heading { margin:8px 0 22px; }
    .route-list { display:grid; gap:12px; margin-top:23px; }
    .route-card { display:flex; align-items:center; justify-content:space-between; gap:14px; border-radius:18px; padding:20px; background:linear-gradient(130deg,#1d2b36,#171f2e); border:1px solid #344355; }
    .route-content { display:flex; gap:14px; align-items:center; min-width:0; }
    .route-symbol { display:grid; place-items:center; width:45px; height:45px; color:var(--accent); background:#244036; border-radius:13px; flex-shrink:0; }
    .route-primary { display:flex; align-items:center; flex-wrap:wrap; gap:7px; font-size:14px; font-weight:760; }
    .route-primary .icon { color:var(--accent); }
    .route-secondary { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; margin-top:5px; }
    .route-secondary .icon { color:var(--blue); }
    .priority-window { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-top:23px; padding:17px 20px; border:1px solid var(--line); border-radius:16px; background:var(--surface); }
    .priority-window-label { display:block; font-size:13px; font-weight:760; color:var(--text); margin-bottom:5px; }
    .priority-window-help { color:var(--muted); font-size:12px; line-height:1.55; margin:0; max-width:440px; }
    .priority-window .form-select { width:175px; min-width:175px; height:44px; font-size:13px; }
    .rule-list { background:#141e2c; border:1px solid #2b3849; border-radius:18px; padding:22px; margin-top:28px; }

<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <input id="backup-file-input" class="sr-only" type="file" accept=".json,application/json" aria-label="Datensicherung importieren">
  <script>
  (() => {
    'use strict';

    // Transitous/MOTIS2: ohne API-Schlüssel, nur für nichtkommerzielle Nutzung.
    // Für dauerhafte Nutzung als Website mit Kontakt veröffentlichen (Referer).
    const API = 'https://api.transitous.org';
    const STOPTIMES_ENDPOINT = '/api/v6/stoptimes';
    const PLAN_ENDPOINT = '/api/v6/plan';
    const GEOCODE_ENDPOINT = '/api/v1/geocode';
    // Offizielle DB Timetables (IRIS), per nutzereigenem Zugang aktiviert.
    const DB_API = 'https://apis.deutschebahn.com/db-api-marketplace/apis/timetables/v1';
    const DB_SETTINGS_KEY = 'haltestellen.db-timetables.v1';
    const DB_PLAN_CACHE_MS = 6 * 60 * 60 * 1000;
    const DB_BOARD_CACHE_MS = 150 * 1000;
    const DB_REQUEST_SPACING_MS = 1100; // unter 60 API-Aufrufen / Minute
    let dbQueue = Promise.resolve(), dbNextSlot = 0;
    const STORAGE_KEY = 'nextstop.v1';
    const AUTO_WINDOW = 30 * 60 * 1000;
    const PRIORITY_WINDOWS = [15,30,45,60,90,120];
    const DEFAULT_PRIORITY_MINUTES = 90; // Bisheriger Standard für v2-Bestandsdaten.
    const REFRESH_INTERVAL = 3 * 60 * 1000;
    const PLAN_COOLDOWN = 15 * 60 * 1000; // Schont die Transitous-Routing-API.
    const STOPTIMES_COUNT = 45;
    const BOARD_DURATION_MIN = 90;
    const MODES = [
      ['all', 'Alle Verkehrsmittel'],
      ['bus', 'Bus'],
      ['suburban', 'S-Bahn'],
      ['regional', 'RE / RB'],
      ['subway', 'U-Bahn'],
      ['tram', 'Straßenbahn'],
      ['longDistance', 'ICE / IC / EC'],
      ['ferry', 'Fähre']
    ];
    const PRODUCT_FILTERS = {
      all: [], bus: ['bus'], suburban: ['suburban'], regional: ['regionalExpress','regional'],
      subway: ['subway'], tram: ['tram'], longDistance: ['nationalExpress','national'], ferry: ['ferry']
    };
    const ALL_PRODUCTS = ['nationalExpress','national','regionalExpress','regional','suburban','bus','ferry','subway','tram','taxi'];
    const ICONS = {
      train: '<rect x="5" y="3" width="14" height="15" rx="3"/><path d="M8 21l2-3m6 0 2 3M5 11h14M8 7h2m4 0h2M8 15h.01M16 15h.01"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      arrowRight: '<path d="M5 12h14m-6-6 6 6-6 6"/>',
      chevronRight: '<path d="m9 18 6-6-6-6"/>',
      arrowLeft: '<path d="m19 12-14 0m6-6-6 6 6 6"/>',
      pin: '<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      refresh: '<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.8 9A7 7 0 0 1 18 7l2 5M4 12l2 5a7 7 0 0 0 12.2-2"/>',
      star: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/>',
      layers: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
      trash: '<path d="M3 6h18m-2 0-1 15H6L5 6m3 0V4h8v2m-6 4v7m4-7v7"/>',
      close: '<path d="M18 6 6 18M6 6l12 12"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/>',
      check: '<path d="m5 12 4 4L19 6"/>',
      alert: '<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v4m0 4h.01"/>',
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',
      edit: '<path d="M12 20h9M16 4l4 4-11 11H5v-4L16 4Z"/>',
      arrows: '<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>',
      bus: '<rect x="5" y="3" width="14" height="16" rx="3"/><path d="M5 11h14M8 19v2m8-2v2M8 15h.01M16 15h.01"/>',
      tram: '<rect x="6" y="4" width="12" height="15" rx="3"/><path d="M4 4h16M9 4V2m6 2V2M6 12h12M9 16h.01M15 16h.01M8 22l3-3m5 3-3-3"/>',
      subway: '<rect x="5" y="3" width="14" height="17" rx="4"/><path d="M8 3V1m8 2V1M5 11h14M9 16h.01M15 16h.01M8 22l2-2m6 2-2-2"/>',
      ferry: '<path d="M4 15 12 19l8-4-2-8H6l-2 8ZM9 7V4h6v3M3 21l3-1 3 1 3-1 3 1 3-1 3 1"/>',
      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',
      download: '<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',
      upload: '<path d="M12 17V5m-4 4 4-4 4 4M4 17v4h16v-4"/>'
    };

    const el = id => document.getElementById(id);
    const icon = (name, cls = '') => `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.info}</svg>`;
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uid = () => (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
    const norm = s => String(s || '').toLocaleLowerCase('de-DE').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/\s*\([^)]*\)\s*/g,' ').replace(/[^\p{L}\p{N}]/gu,' ').replace(/\s+/g,' ').trim();
    // Unterschiedliche Bezeichnungen für dieselbe Station vereinheitlichen.
    const stationKey = s => norm(String(s||'').replace(/hauptbahnhof/gi,'Hbf').replace(/\bHauptbf\b/gi,'Hbf').replace(/\bBhf\b/gi,'Bahnhof').replace(/[,\s]+(?:Gleis|Steig|Bahnsteig|Platform)\s*[0-9a-z]+.*$/i,''));
    const coordinates = p => ({lat:Number(p?.lat??p?.latitude??p?.location?.latitude),lon:Number(p?.lon??p?.longitude??p?.location?.longitude)});
    const distanceMeters = (a,b) => {
      const x=coordinates(a),y=coordinates(b);
      if(![x.lat,x.lon,y.lat,y.lon].every(Number.isFinite) || ![x.lat,x.lon,y.lat,y.lon].every(v => Math.abs(v)>0.01)) return Infinity;
      const r=Math.PI/180,dy=(y.lat-x.lat)*r,dx=(y.lon-x.lon)*r;
      const q=Math.sin(dy/2)**2+Math.cos(x.lat*r)*Math.cos(y.lat*r)*Math.sin(dx/2)**2;
      return 6371000*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
    };
    const relativeMinutes = date => date == null ? null : Math.ceil((date - Date.now()) / 60000);
    const modeLabel = mode => (MODES.find(m => m[0] === mode) || MODES[0])[1];
    const modeIcon = mode => ({all:'layers',bus:'bus',suburban:'train',regional:'train',subway:'subway',tram:'tram',longDistance:'train',ferry:'ferry'})[mode] || 'layers';
    const toTime = value => { if (!value) return null; const t = new Date(value).getTime(); return Number.isFinite(t) ? t : null; };
    const timeOf = entry => toTime(entry?.when ?? entry?.plannedWhen ?? entry?.departure ?? entry?.plannedDeparture ?? entry?.arrival ?? entry?.plannedArrival);
    const fmtTime = value => value ? new Intl.DateTimeFormat('de-DE', {hour:'2-digit',minute:'2-digit'}).format(new Date(value)) : '–:–';
    const fmtDate = () => new Intl.DateTimeFormat('de-DE', {weekday:'long',day:'numeric',month:'long'}).format(new Date());
    const isCancelled = item => Boolean(item?.cancelled || item?.canceled || (item?.when === null && item?.plannedWhen && item?.delay === null));
    const stopById = id => state.stops.find(s => s.id === String(id));
    const isFuture = item => { const t = timeOf(item); return t != null && t >= Date.now() - 90000 && !isCancelled(item); };
    const isWithin = (item, window) => isFuture(item) && timeOf(item) <= Date.now() + window;
    const manualWindowMs = () => state.priorityMinutes * 60 * 1000;
    const scheduledTimeOf = entry => toTime(entry?.plannedWhen ?? entry?.plannedDeparture) ?? timeOf(entry);
    function inManualWindow(entry) {
      // Die Auswahl gilt symmetrisch um die PLANMÄSSIGE Zeit. Verspätete Fahrten
      // bleiben sichtbar, wenn die planmäßige Abfahrt bereits zurückliegt,
      // die tatsächliche Abfahrt aber noch bevorsteht.
      const planned=scheduledTimeOf(entry), now=Date.now();
      return planned!==null && !isCancelled(entry) && timeOf(entry)!==null
        && timeOf(entry)>=now-90000 && Math.abs(planned-now)<=manualWindowMs();
    }
    function hasCityPrefix(stop) {
      const city=norm(stop.city), name=norm(stop.name);
      return Boolean(city && (name===city || name.startsWith(`${city} `)));
    }

    function readSaved() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const stops = Array.isArray(parsed.stops) ? parsed.stops.filter(s => s && typeof s.id === 'string' && typeof s.name === 'string').slice(0,100) : [];
        const routes = Array.isArray(parsed.routes) ? parsed.routes.filter(r => r && r.from && r.to && r.from !== r.to && PRODUCT_FILTERS[r.mode || 'all'] !== undefined).slice(0,100) : [];
        const preference=Number(parsed.priorityMinutes);
        const priorityMinutes=PRIORITY_WINDOWS.includes(preference) ? preference : DEFAULT_PRIORITY_MINUTES;
        return {stops, routes, priorityMinutes};
      } catch { return {stops:[],routes:[],priorityMinutes:DEFAULT_PRIORITY_MINUTES}; }
    }
    function readDBSettings() {
      try {
        const stored = sessionStorage.getItem(DB_SETTINGS_KEY) || localStorage.getItem(DB_SETTINGS_KEY);
        if(!stored)return {clientId:'',apiKey:'',remember:false};
        const value=JSON.parse(stored);
        return {clientId:String(value.clientId||''),apiKey:String(value.apiKey||''),
          remember:Boolean(localStorage.getItem(DB_SETTINGS_KEY))};
      } catch {return {clientId:'',apiKey:'',remember:false};}
    }
    const saved = readSaved();
    const state = {
      stops:saved.stops, routes:saved.routes, priorityMinutes:saved.priorityMinutes, view:'home', activeStopId:null, detailTab:'departures',
      boards:new Map(), arrivals:new Map(), projections:new Map(), loading:new Set(), arriving:new Set(),
      errors:new Map(), arrivalErrors:new Map(), timestamps:new Map(),
      modal:null, selectedCandidate:null, searchResults:[], searchTerm:'', searchState:'idle', searchToken:0,
      busy:false, migrating:false, planCache:new Map(), lastRefresh:0, lastApiRequestAt:null, pendingPriorityRefresh:false, searchTimer:null, toastTimer:null,
      pendingImport:null, dataRevision:0,
      dbSettings:readDBSettings(), dbStatus:'', dbUnavailable:false, dbError:'',
      dbStationLookup:new Map(), dbPlanCache:new Map(), dbBoardCache:new Map(), dbInFlight:new Map()
    };
    function persist() {
      try {localStorage.setItem(STORAGE_KEY, JSON.stringify({stops:state.stops,routes:state.routes,priorityMinutes:state.priorityMinutes}));}
      catch { toast('Speichern nicht möglich. Prüfe die Browser-Einstellungen.', true); }
    }
    const BACKUP_FORMAT = 'haltestellen-backup';
    const BACKUP_VERSION = 1;
    const MAX_BACKUP_BYTES = 1024 * 1024;
    let deferredInstallPrompt = null;

    function backupPayload() {
      return {
        format:BACKUP_FORMAT,
        version:BACKUP_VERSION,
        exportedAt:new Date().toISOString(),
        stops:state.stops.map(s=>({id:s.id,name:s.name,city:s.city||'',lat:s.lat??null,lon:s.lon??null,api:s.api||'legacy',evaNo:s.evaNo||null})),
        routes:state.routes.map(r=>({id:r.id,from:r.from,to:r.to,mode:r.mode||'all'})),
        priorityMinutes:state.priorityMinutes

      const yr=2000+Number(t.slice(0,2)),mo=Number(t.slice(2,4)),day=Number(t.slice(4,6));
      const h=Number(t.slice(6,8)),min=Number(t.slice(8,10));
      if(mo<1||mo>12||day<1||day>31||h>23||min>59)return null;
      const guess=Date.UTC(yr,mo-1,day,h,min);
      // Die DB-Zeit ist Europe/Berlin (auch wenn der Browser in einer anderen
      // Zeitzone läuft). Zonen-Offset am Datum der Fahrt berechnen.
      const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
        .formatToParts(new Date(guess));
      const v=Object.fromEntries(parts.filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));
      const offset=Date.UTC(v.year,v.month-1,v.day,v.hour,v.minute)-guess;
      return new Date(guess-offset).toISOString();
    }
    function dbAttributes(element) {
      return element?Object.fromEntries([...element.attributes].map(a=>[a.name,a.value])):{};
    }
    function dbFindChild(element,name) {
      return element?[...element.children].find(c=>c.tagName===name)||null:null;
    }
    async function dbGetEva(stop) {
      if(/^\d{6,9}$/.test(String(stop.evaNo||'')))return String(stop.evaNo);
      if(state.dbStationLookup.has(stop.id))return state.dbStationLookup.get(stop.id);
      if(!dbIsReady())return null;
      try {
        const xml=await dbFetchXML('/station/'+encodeURIComponent(stop.name.trim()));
        const matches=[...xml.querySelectorAll('station')]
          .map(e=>({eva:e.getAttribute('eva'),name:e.getAttribute('name')}))
          .filter(s=>/^\d{6,9}$/.test(s.eva||''));
        const exact=matches.filter(s=>stationKey(s.name)===stationKey(stop.name));
        const chosen=exact.length===1?exact[0]:null;
        const eva=chosen?.eva||null;
        state.dbStationLookup.set(stop.id,eva);
        // Uneindeutige oder unpassende Bahnhöfe nicht einfach zuordnen.
        if(eva){stop.evaNo=eva;persist();}
        return eva;
      } catch(error) {
        if(error?.status===404){state.dbStationLookup.set(stop.id,null);return null;}
        throw error;
      }
    }
    async function dbPlan(eva,slot) {
      const key=`${eva}:${slot.date}:${slot.hour}`,cached=state.dbPlanCache.get(key);
      if(cached && Date.now()-cached.at<DB_PLAN_CACHE_MS)return cached.xml;
      try {
        const xml=await dbFetchXML(`/plan/${eva}/${slot.date}/${slot.hour}`);
        if(state.dbPlanCache.size>250)state.dbPlanCache.clear();
        state.dbPlanCache.set(key,{at:Date.now(),xml});
        return xml;
      } catch(error) {
        if(error?.status===404){state.dbPlanCache.set(key,{at:Date.now(),xml:null});return null;}
        throw error;
      }
    }
    function dbParseTimetable(planXMLs,updatesXML) {
      const records=new Map();
      const merge=(xml)=>{
        if(!xml)return;
        for(const node of xml.querySelectorAll('s')) {
          const id=node.getAttribute('id');if(!id)continue;
          const old=records.get(id)||{id,tl:{},ar:{},dp:{}};
          for(const tag of ['tl','ar','dp']){
            const child=dbFindChild(node,tag);
            if(child)old[tag]={...old[tag],...dbAttributes(child)};
          }
          records.set(id,old);
        }
      };
      for(const xml of planXMLs)merge(xml);
      merge(updatesXML);
      const result={departures:[],arrivals:[]};
      for(const record of records.values()) {
        const tl=record.tl,category=String(tl.c||'Zug').toUpperCase();
        const line=String(tl.l||'').trim(),number=String(tl.n||'').trim();
        const name=line && !norm(line).startsWith(norm(category)) ? `${category} ${line}`
          : line || (number?`${category} ${number}`:category);
        const product=/^(ICE|IC|EC|EN|NJ|RJ|TGV|FLX)/.test(category)?'nationalExpress'
          : /^RE/.test(category)?'regionalExpress':/^S$/.test(category)?'suburban':'regional';
        for(const [tag,arrival,key] of [['dp',false,'departures'],['ar',true,'arrivals']]) {
          const ev=record[tag];
          const planned=dbTimeToISO(ev.pt||ev.ct),actual=dbTimeToISO(ev.ct)||planned;
          if(!planned||!actual)continue;
          const path=String(ev.cpth||ev.ppth||'').split('|').map(x=>x.trim()).filter(Boolean);
          const platform=ev.cp||ev.pp||null,plannedPlatform=ev.pp||null;
          const live=Boolean(ev.ct);
          const delta=live?Math.round((toTime(actual)-toTime(planned))/1000):null;
          const entry={when:actual,plannedWhen:planned,delay:delta,platform,plannedPlatform,
            line:{name,id:`db:${record.id}`,product},
            direction:arrival?'':(path[path.length-1]||'Ziel unbekannt'),
            provenance:arrival?(path[0]||'Herkunft unbekannt'):null,
            stopovers:arrival?[]:path.map(p=>({stop:{id:null,name:p},arrival:null,plannedArrival:null,_realTime:null})),
            cancelled:String(ev.cs||'').toLowerCase()==='c',
            _realTime:live,_dbId:record.id,_dbSource:true,_dbPlatformChanged:Boolean(ev.cp&&ev.pp&&norm(ev.cp)!==norm(ev.pp))};
          result[key].push(entry);
        }
      }
      result.departures.sort((a,b)=>timeOf(a)-timeOf(b));
      result.arrivals.sort((a,b)=>timeOf(a)-timeOf(b));
      return result;
    }
    async function dbLoadBoard(stop) {
      if(!dbIsReady())return null;
      const cached=state.dbBoardCache.get(stop.id);
      if(cached&&Date.now()-cached.at<DB_BOARD_CACHE_MS)return cached.board;
      if(state.dbInFlight.has(stop.id))return state.dbInFlight.get(stop.id);
      const promise=(async()=>{
        const eva=await dbGetEva(stop);
        if(!eva)return null;
        const now=Date.now(),hasManual=state.routes.some(r=>r.from===stop.id);
        const offsets=hasManual && state.priorityMinutes>60?[-2,-1,0,1,2]:[-1,0,1,2];
        const unique=new Map();
        for(const n of offsets){const slot=dbLocalDateTime(now+n*3600000);unique.set(`${slot.date}/${slot.hour}`,slot);}
        const plans=[];
        // Plan-Endpunkte sind statisch und werden mehrere Stunden gehalten.
        for(const slot of unique.values()){
          if(!dbIsReady())break;
          try {const xml=await dbPlan(eva,slot);if(xml)plans.push(xml);}
          catch(error){if(error?.status===429)break;if(state.dbUnavailable)break;console.info('DB-Sollfahrplan nicht verfügbar',error.message);}
        }
        if(!dbIsReady())return null;
        let changes=null;
        try {changes=await dbFetchXML('/fchg/'+eva);}
        catch(error){if(state.dbUnavailable)return null;console.info('DB-Fahrplanänderungen nicht verfügbar',error.message);}
        if(!plans.length&&!changes)return null;
        const board=dbParseTimetable(plans,changes);
        state.dbBoardCache.set(stop.id,{at:Date.now(),board});
        state.dbStatus=`DB-Bahnhofsdaten geladen · ${stop.name}`;
        return board;
      })().finally(()=>state.dbInFlight.delete(stop.id));
      state.dbInFlight.set(stop.id,promise);
      return promise;
    }
    function dbMatchScore(original,db) {
      if(lineClass(original)!=='rail'||lineClass(db)!=='rail')return -1;
      const p1=scheduledTimeOf(original),p2=scheduledTimeOf(db);
      if(p1==null||p2==null)return -1;
      const diff=Math.abs(p1-p2);
      if(diff>120000)return -1;
      const a=norm(lineName(original)).replace(/\s/g,''),b=norm(lineName(db)).replace(/\s/g,'');
      if(a && b && a===b)return 100-Math.round(diff/1000);
      const dst1=stationKey(original.direction),dst2=stationKey(db.direction);
      if(diff<=45000&&dst1&&dst1===dst2)return 40-Math.round(diff/1000);
      return -1;
    }
    function dbMergeEntries(original,extra) {
      // DB-Prognose hat Vorrang. Ein reiner DB-Sollfahrplan überschreibt
      // vorhandene, bestätigte Transitous-Echtzeitinformationen nicht.
      const useDBTime=extra._realTime && toTime(extra.when)!=null;
      const planned=extra.plannedWhen||original.plannedWhen;
      const actual=useDBTime?extra.when:(original.when||extra.when);
      const platform=extra._dbPlatformChanged?extra.platform:
        (original.platform||extra.platform||original.plannedPlatform);
      return {...original,when:actual,plannedWhen:planned,
        delay:useDBTime?Math.round((toTime(actual)-toTime(planned))/1000):original.delay,
        _realTime:useDBTime||original._realTime,
        _inferredPrediction:useDBTime?false:original._inferredPrediction,
        platform,plannedPlatform:extra.plannedPlatform||original.plannedPlatform,
        cancelled:extra.cancelled||original.cancelled,_dbSource:true};
    }
    function dbOverlayBoard(transitous,dbItems) {
      const all=transitous.slice(),used=new Set();
      for(const db of dbItems) {
        let winner=-1,best=-1;
        for(let i=0;i<all.length;i++) {
          if(used.has(i))continue;
          const score=dbMatchScore(all[i],db);
          if(score>best){winner=i;best=score;}
        }
        if(winner>=0){all[winner]=dbMergeEntries(all[winner],db);used.add(winner);}
        else {all.push(db);used.add(all.length-1);}
      }
      return all.filter(d=>timeOf(d)!=null).sort((a,b)=>timeOf(a)-timeOf(b));
    }
    async function dbEnhanceStop(stop,id,revision,arrival=false) {
      if(!dbIsReady())return;

        const db=await dbLoadBoard(stop);

        const map=arrival?state.arrivals:state.boards;
        if(!map.has(id))return;

        renderApp();

        if(!state.dbUnavailable && error?.status===429)state.dbStatus='DB-Anfragelimit erreicht. Transitous bleibt aktiv.';
        else if(!state.dbUnavailable)state.dbStatus='DB momentan nicht verfügbar. Transitous bleibt aktiv.';
        console.info('DB-Daten nicht verfügbar, Transitous bleibt aktiv:',error.message);
        renderApp();
      }
    }

    async function fetchJSON(path, params = {}, timeout = 15000) {
      state.lastApiRequestAt=Date.now();
      updateApiRequestLabel();
      const search = new URLSearchParams(params);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(),timeout);
      try {
        const response = await fetch(`${API}${path}?${search.toString()}`, {
          method:'GET',mode:'cors',credentials:'omit',
          headers:{'Accept':'application/json'},signal:controller.signal
        });
        if (!response.ok) {const error = new Error(`HTTP ${response.status}`);error.status=response.status;throw error;}
        const data = await response.json();
        if(data && typeof data==='object' && data.error) throw new Error(String(data.error.message||data.error));
        return data;
      } finally { clearTimeout(timer); }
    }
    async function geocode(query) {
      return stationCandidates(await fetchJSON(GEOCODE_ENDPOINT,{text:query,type:'STOP',language:'de'},15000));
    }
    // /plan erst nach 15 Min. wieder abfragen, und nur falls die Abfahrtstafel
    // eine feste Route nicht bereits über nextStops identifizieren kann.
    async function findDirectJourney(route) {
      const from=stopById(route.from),to=stopById(route.to);
      if(!from||!to||from.api!=='transitous'||to.api!=='transitous') return null;
      const cached=state.planCache.get(route.id);
      if(cached && Date.now()-cached.at<PLAN_COOLDOWN) return cached.entry;
      state.planCache.set(route.id,{at:Date.now(),entry:null});
      const params={fromPlace:from.id,toPlace:to.id,maxTransfers:'0',timetableView:'true',searchWindow:String(Math.round(2*manualWindowMs()/1000)),time:new Date(Date.now()-manualWindowMs()).toISOString(),language:'de'};
      const result=await fetchJSON(PLAN_ENDPOINT,params,20000);
      const entries=[];
      for(const itinerary of result?.itineraries||[]) {
        const transit=(itinerary.legs||[]).filter(l=>
          !['WALK','BIKE','CAR','RENTAL','CAR_PARKING','CAR_DROPOFF'].includes(String(l.mode||'')));
        if(transit.length!==1) continue;
        const leg=transit[0];
        if(!sameStop(leg.from,from)||!sameStop(leg.to,to)) continue;
        const normalized=normalizeStopTime({
          mode:leg.mode,displayName:leg.displayName,routeShortName:leg.routeShortName,
          tripId:leg.tripId,tripShortName:leg.tripShortName,headsign:leg.headsign,
          tripTo:leg.tripTo||leg.to,realTime:leg.realTime,cancelled:leg.cancelled,
          place:{departure:leg.startTime,scheduledDeparture:leg.scheduledStartTime,
            track:leg.from?.track,scheduledTrack:leg.from?.scheduledTrack},
          nextStops:[{...leg.to,arrival:leg.endTime||leg.to?.arrival||null,
            scheduledArrival:leg.scheduledEndTime||leg.to?.scheduledArrival||null}]
        });
        if(isMode(normalized,route.mode) && inManualWindow(normalized)) {
          normalized._routeId=route.id;
          normalized._fromJourney=true;
          entries.push(normalized);
        }
      }
      entries.sort((a,b)=>timeOf(a)-timeOf(b));
      const entry=entries[0]||null;
      state.planCache.set(route.id,{at:Date.now(),entry});
      return entry;
    }
    async function loadManualProjections(id, board, revision=state.dataRevision) {
      const from = stopById(id);
      if (!from) return;
      const routes = state.routes.filter(r => String(r.from) === String(id));
      if (!routes.length) {state.projections.delete(String(id));return;}
      const projections = [];
      for (const route of routes) {
        if (!stopById(route.to)) continue;
        const hasMatch = board.some(d => inManualWindow(d) && isMode(d,route.mode) && getDirectTarget(d,from,stopById(route.to)));
        if (hasMatch) continue;
        try {
          const extra = await findDirectJourney(route);
          if (extra && stopById(id)) projections.push(extra);
        } catch (error) {
          console.info('Route konnte nicht abgefragt werden:',statusText(error));
        }
      }
      if(revision===state.dataRevision)state.projections.set(String(id),projections);
    }
    async function loadStop(id) {
      if(!navigator.onLine)return;
      const revision=state.dataRevision;
      id=String(id);
      const stop=stopById(id);
      if(state.loading.has(id)||!stop) return;
      if(stop.api!=='transitous') {
        state.errors.set(id,'Haltestelle der alten API: bitte neu zuordnen.');
        renderApp();return;
      }
      state.loading.add(id);state.errors.delete(id);renderApp();
      try {
        const hasManualRoutes=state.routes.some(route=>String(route.from)===id);
        const lookbackMs=hasManualRoutes ? manualWindowMs() : 0;
        const lookaheadMs=hasManualRoutes ? Math.max(AUTO_WINDOW,manualWindowMs()) : AUTO_WINDOW;
        const params={stopId:id,n:String(STOPTIMES_COUNT),
          window:String(Math.round((lookbackMs+lookaheadMs)/1000)),fetchStops:'true',language:'de'};
        if(hasManualRoutes) {
          // Ohne diesen Blick zurück verschwinden verspätete, planmäßig
          // bereits abgefahrene Verbindungen aus der API-Abfahrtstafel.
          params.time=new Date(Date.now()-lookbackMs).toISOString();
          params.realtimeMode='REALTIME_ANNOTATION_ONLY';
        }
        let data;
        try { data=await fetchJSON(STOPTIMES_ENDPOINT,params,18000); }
        catch(error) {
          // `fetchStops` ist experimentell; eine nicht unterstützende Version
          // darf die normale Abfahrtstafel nicht komplett blockieren.
          if(error.status!==400) throw error;
          delete params.fetchStops;
          data=await fetchJSON(STOPTIMES_ENDPOINT,params,18000);
        }
        if(revision!==state.dataRevision||!stopById(id)) return;
        const board=normalizeBoard(data);
        state.boards.set(id,board);
        state.timestamps.set(id,Date.now());
        renderApp();
        await dbEnhanceStop(stop,id,revision,false);
        await loadManualProjections(id,state.boards.get(id)||board,revision);
      } catch(error) {
        if(revision===state.dataRevision&&stopById(id)){
          let recovered=false;
          if(dbIsReady()){
            try {
              const alternative=await dbLoadBoard(stop);
              if(alternative?.departures?.length){
                state.boards.set(id,alternative.departures);state.timestamps.set(id,Date.now());
                state.errors.delete(id);recovered=true;
                renderApp();await loadManualProjections(id,alternative.departures,revision);
              }
            } catch(dbError){console.info('DB-Fallback gescheitert:',dbError.message);}
          }
          if(!recovered)state.errors.set(id,statusText(error));
        }
      }
      finally {if(revision===state.dataRevision){state.loading.delete(id);renderApp();}}
    }
    async function loadArrivals(id) {
      if(!navigator.onLine)return;
      const revision=state.dataRevision;
      id=String(id);
      const stop=stopById(id);
      if(state.arriving.has(id)||!stop||stop.api!=='transitous')return;
      state.arriving.add(id);state.arrivalErrors.delete(id);renderApp();
      try {
        // Für Ankünfte bedeutet "EARLIER": alle Fahrten vor der Zeitgrenze.
        // Zeitgrenze = jetzt + 90 Min.; alte Ankünfte werden clientseitig entfernt.

        const data=await fetchJSON(STOPTIMES_ENDPOINT,{stopId:id,n:String(STOPTIMES_COUNT),arriveBy:'true',direction:'EARLIER',time,window:'5400',fetchStops:'true',language:'de'},18000);
        if(revision===state.dataRevision&&stopById(id)) {
          state.arrivals.set(id,normalizeBoard(data,true));

    function replacementScore(original,candidate) {
      const a=stationKey(original.name),b=stationKey(candidate.name);
      if(!a||!b) return -1;
      // Do not silently associate an ambiguous stop with the wrong city.
      if(a!==b) return -1;
      const city=stationKey(original.city);
      const regions=(candidate.areas||[]).map(area=>stationKey(area.name));
      const cityMatches=city && (b.includes(city)||regions.some(region=>region===city||region.includes(city)));
      const closeToOriginal=distanceMeters(original,candidate)<1800;
      // Eindeutige Namen allein reichen für häufige Bezeichnungen wie "Rathaus" nicht.
      // Ist eine Stadt hinterlegt, benötigen wir eine passende Ortsangabe oder Koordinate.
      if(city && !cityMatches && !closeToOriginal) return -1;
      return 100+(cityMatches?20:0)+(closeToOriginal?15:0)
        +(candidate.country==='DE'?5:0)+(candidate.importance||0);
    }
    async function migrateLegacyStops() {
      const old=state.stops.filter(s=>s.api!=='transitous');
      if(!old.length) {if(state.stops.length)refreshAll(true);return;}
      state.migrating=true;renderApp();
      let offlineMessage='';
      for(const stop of old) {
        if(offlineMessage) {state.errors.set(stop.id,offlineMessage);continue;}
        try {
          let list=await geocode(stop.name);
          let ranked=list.map(candidate=>({candidate,score:replacementScore(stop,candidate)}))
            .filter(x=>x.score>=100).sort((a,b)=>b.score-a.score);
          if(!ranked.length && stop.city && !stationKey(stop.name).includes(stationKey(stop.city))) {
            list=await geocode(`${stop.city} ${stop.name}`);
            ranked=list.map(candidate=>({candidate,score:replacementScore(stop,candidate)}))
              .filter(x=>x.score>=100).sort((a,b)=>b.score-a.score);
          }
          const match=ranked[0]?.candidate;
          if(!match||state.stops.some(s=>s!==stop && s.id===String(match.id))) {
            state.errors.set(stop.id,'Alte Haltestellen-ID. Bitte neu zuordnen.');
            continue;
          }
          const oldId=stop.id;
          Object.assign(stop,{id:String(match.id),name:match.name,lat:match.lat,lon:match.lon,api:'transitous'});
          for(const route of state.routes) {
            if(route.from===oldId)route.from=stop.id;
            if(route.to===oldId)route.to=stop.id;
          }
          state.errors.delete(oldId);
        } catch(error) {
          offlineMessage=`Migration nicht möglich: ${statusText(error)} Bitte später neu zuordnen.`;
          state.errors.set(stop.id,offlineMessage);
        }
      }
      state.migrating=false;persist();renderApp();

    async function refreshAll(force = false) {
      if(!navigator.onLine||state.busy||state.migrating) return;
      const revision=state.dataRevision;
      const existing=state.stops.filter(s=>s.api==='transitous').map(s=>s.id);
      if(!existing.length) {state.lastRefresh=Date.now();renderApp();return;}
      if(!force && Date.now()-state.lastRefresh<REFRESH_INTERVAL) return;
      state.busy=true;state.lastRefresh=Date.now();renderApp();
      let position=0;
      const worker=async()=>{while(position<existing.length){await loadStop(existing[position++]);}};
      try {await Promise.all(Array.from({length:Math.min(2,existing.length)},worker));}
      finally {
        if(revision!==state.dataRevision)return;
        state.busy=false;renderApp();
        if(state.activeStopId && state.view==='detail')loadArrivals(state.activeStopId);
        if(state.pendingPriorityRefresh) {
          state.pendingPriorityRefresh=false;
          refreshAll(true);
        }
      }

    const SORT_HOLD_MS=500;

    function activateStopSort(gesture) {

      gesture.grid.classList.add('is-sorting');

    function positionSortGhost(gesture) {

    }
    function reorderAtSortPointer(gesture) {
      const others=[...gesture.grid.children].filter(node=>node!==gesture.card&&node.classList.contains('stop-card'));
      if(!others.length)return;

      if(!nearest)return;
      const singleColumn=getComputedStyle(gesture.grid).gridTemplateColumns.trim().split(/\s+/).length===1;
      const after=singleColumn||Math.abs(nearest.ydist)>.28
        ?gesture.y>=nearest.rect.top+nearest.rect.height/2
        :gesture.x>=nearest.rect.left+nearest.rect.width/2;
      const before=after?nearest.node.nextElementSibling:nearest.node;
      if(before===gesture.card||gesture.card.nextElementSibling===before)return;
      gesture.grid.insertBefore(gesture.card,before);
    }
    function moveStopSort(x,y) {
      const gesture=sortGesture;if(!gesture)return;
      gesture.x=x;gesture.y=y;
      if(!gesture.active) {
        if(Math.hypot(x-gesture.startX,y-gesture.startY)>SORT_TOLERANCE)endStopSort(true);
        return;
      }
      positionSortGhost(gesture);
      reorderAtSortPointer(gesture);
    }
    function scrollWhileSorting() {
      const gesture=sortGesture;
      if(!gesture?.active)return;
      const edge=85;
      const speed=gesture.y<edge ? -Math.min(22,(edge-gesture.y)*.32)
        :gesture.y>innerHeight-edge ? Math.min(22,(gesture.y-(innerHeight-edge))*.32):0;
      if(speed) {
        const before=window.scrollY;
        window.scrollBy(0,speed);
        if(window.scrollY!==before)reorderAtSortPointer(gesture);
      }
      gesture.frame=requestAnimationFrame(scrollWhileSorting);
    }
    function endStopSort(cancel=false) {
      const gesture=sortGesture;if(!gesture)return;
      clearTimeout(gesture.timer);
      if(gesture.frame!==null)cancelAnimationFrame(gesture.frame);
      gesture.ghost?.remove();
      gesture.card.classList.remove('drag-placeholder');
      gesture.grid.classList.remove('is-sorting');
      document.body.classList.remove('sorting-stops');
      sortGesture=null;
      if(gesture.active) {
        blockedCardClickUntil=Date.now()+750;
        if(!cancel) {
          const ids=[...gesture.grid.querySelectorAll(':scope > .stop-card')].map(node=>node.dataset.stopId);
          if(ids.length===state.stops.length && ids.every(id=>stopById(id))) {
            const before=state.stops.map(s=>s.id).join('\u0000');
            const after=ids.join('\u0000');
            if(before!==after){state.stops=ids.map(id=>stopById(id));persist();}
          }
        }
        renderApp();

    function onSearch(value) {
      state.searchTerm=value;state.searchResults=[];state.searchToken++;
      const token=state.searchToken;
      clearTimeout(state.searchTimer);
      if(value.trim().length<2){state.searchState='idle';renderSearchResults();return;}
      state.searchState='loading';renderSearchResults();
      state.searchTimer=setTimeout(async()=>{
        try {
          const arr=await geocode(value.trim());
          if(token!==state.searchToken||!['add-stop','relink-stop'].includes(state.modal?.type))return;
          state.searchResults=arr.slice(0,9);
          state.searchState='done';renderSearchResults();
        } catch(error) {
          if(token!==state.searchToken)return;
          state.searchError=statusText(error);
          state.searchState='error';renderSearchResults();
        }
      },420);
    }
    function saveCandidate() {
      const candidate=state.selectedCandidate;if(!candidate)return;
      const id=String(candidate.id),old=state.modal?.type==='relink-stop'?stopById(state.modal.id):null;
      if(stopById(id) && stopById(id)!==old){toast('Diese Haltestelle ist bereits gespeichert.',true);return;}
      const city=(el('city-input')?.value||guessCity(candidate)).trim().slice(0,100)||guessCity(candidate);
      if(old) {
        const oldId=old.id;
        Object.assign(old,{id,name:String(candidate.name),city,lat:candidate.lat,lon:candidate.lon,api:'transitous',evaNo:null});
        state.errors.delete(oldId);
        for(const route of state.routes) {
          if(route.from===oldId)route.from=id;
          if(route.to===oldId)route.to=id;
        }
        state.projections.clear();state.planCache.clear();
      } else state.stops.push({id,name:String(candidate.name),city,lat:candidate.lat,lon:candidate.lon,api:'transitous'});
      state.lastRefresh=Date.now();persist();closeModal();showView('home');
      toast(old?'Haltestelle erfolgreich neu zugeordnet.':'Haltestelle gespeichert.');
      loadStop(id);
    }
    function saveCity() {
      const stop=stopById(state.modal?.id);if(!stop)return;
      const value=(el('city-input')?.value||'').trim();if(!value){toast('Bitte Stadt oder Ort angeben.',true);return;}
      const eva=(el('db-eva-input')?.value||'').trim();
      if(eva && !/^\d{6,9}$/.test(eva)){toast('Die DB-EVA muss 6 bis 9 Ziffern haben.',true);return;}
      const changed=String(stop.evaNo||'')!==eva;
      stop.city=value.slice(0,100);stop.evaNo=eva||null;
      if(changed) {
        dbResetCache();
        state.boards.delete(stop.id);state.arrivals.delete(stop.id);
      }
      persist();closeModal();renderApp();toast('Haltestelle aktualisiert.');
      if(changed)loadStop(stop.id);
    }
    function saveRoute(event) {
      event.preventDefault();
      const form=el('route-form');if(!form)return;
      const data=new FormData(form),from=String(data.get('from')||''),to=String(data.get('to')||''),mode=String(data.get('mode')||'all');
      if(!stopById(from)||!stopById(to)||from===to){toast('Start und Ziel müssen verschieden sein.',true);return;}
      if(!Object.prototype.hasOwnProperty.call(PRODUCT_FILTERS,mode)){toast('Ungültiges Verkehrsmittel.',true);return;}
      if(state.routes.some(r=>r.from===from&&r.to===to&&r.mode===mode)){toast('Diese Verbindung gibt es bereits.',true);return;}
      if(stopById(from).api!=='transitous'||stopById(to).api!=='transitous') {
        toast('Bitte zuerst die Haltestellen der alten API neu zuordnen.',true);return;
      }
      state.routes.push({id:uid(),from,to,mode});persist();closeModal();showView('routes');toast('Verbindung gespeichert.');
      refreshAll(true);
    }

      }
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&state.modal)closeModal();
      if(event.key==='Enter'&&event.target.id==='station-search'&&state.searchResults.length){
        event.preventDefault();state.selectedCandidate=state.searchResults[0];renderModal();
      }
      if(event.key==='Enter'&&event.target.id==='city-input'){
        event.preventDefault();if(['add-stop','relink-stop'].includes(state.modal?.type))saveCandidate();else if(state.modal?.type==='edit-city')saveCity();
      }
    });
    document.addEventListener('submit',event=>{
      if(event.target?.id==='route-form')saveRoute(event);
    });
    window.addEventListener('beforeinstallprompt',event=>{
      event.preventDefault();
      deferredInstallPrompt=event;
      if(state.view==='home')renderApp();
    });
    window.addEventListener('appinstalled',()=>{
      deferredInstallPrompt=null;
      renderApp();toast('Haltestellen wurde installiert.');
    });
    if('serviceWorker' in navigator && location.protocol!=='file:') {
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('./sw.js',{scope:'./'})
          .catch(error=>console.warn('Offline-Funktion konnte nicht aktiviert werden:',error));
      });
    }
    window.addEventListener('online',()=>{renderApp();refreshAll(true);});
    window.addEventListener('offline',renderApp);
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible'){updateClocks();refreshAll(false);}
    });
    setInterval(()=>{
      if(document.visibilityState!=='visible')return;
      updateClocks();
      if(Date.now()-state.lastRefresh>=REFRESH_INTERVAL)refreshAll(false);
    },15000);
    renderApp();
    if(state.stops.length)migrateLegacyStops();
  })();
  </script>
</body>
</html>
